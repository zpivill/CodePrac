{category:'ds',difficulty:'hard',q:'What is a Bloom filter?',options:['A sorting algorithm','A probabilistic data structure that tests set membership — may have false positives but no false negatives','A type of tree','A hash collision resolver'],answer:1,explain:"Bloom filter uses multiple hash functions and a bit array. Can say 'definitely not in set' or 'probably in set'. Never has false negatives. Space-efficient. Used in databases, caches."},
{category:'ds',difficulty:'hard',q:'What is a skip list?',options:['A list with skipped elements','A probabilistic data structure with multiple levels of linked lists enabling O(log n) search','A list where every other element is skipped','A type of hash table'],answer:1,explain:"Skip list: layered linked lists where higher layers skip more nodes. Average O(log n) search, insertion, deletion. Alternative to balanced BSTs. Used in Redis."},
{category:'ds',difficulty:'hard',q:'What is a Fibonacci heap?',options:['A heap using Fibonacci numbers','A lazy heap supporting O(1) amortized insert/decrease-key, used to optimize Dijkstra and Prim','A heap with Fibonacci sequence','A balanced tree'],answer:1,explain:"Fibonacci heap: lazy heap with excellent amortized complexity: O(1) insert, O(1) decrease-key, O(log n) extract-min. Theoretically optimal for Dijkstra's but complex to implement."},
{category:'ds',difficulty:'hard',q:'What is a persistent data structure?',options:['One stored on disk','One that preserves previous versions when modified — old and new versions coexist','One that never changes','One used for databases'],answer:1,explain:"Persistent data structures preserve all previous versions after modifications. Partial persistence: access old, modify only latest. Full persistence: access and modify any version."},
{category:'ds',difficulty:'hard',q:'What is the time complexity of a Splay tree operation?',options:['O(1) always','O(n) worst case, O(log n) amortized','O(log n) always','O(n log n)'],answer:1,explain:"Splay tree: self-adjusting BST that moves recently accessed nodes to root. Individual operations can be O(n) worst case but O(log n) amortized — recently accessed nodes are faster."},
{category:'ds',difficulty:'hard',q:'What is a Van Emde Boas tree?',options:['A tree named after its inventor','A data structure supporting O(log log U) operations for integers in universe [0, U)','A balanced BST','A trie variant'],answer:1,explain:"Van Emde Boas tree: supports predecessor, successor, insert, delete in O(log log U) time for integers in universe [0,U). Faster than BSTs for integer keys. Space O(U)."},
{category:'ds',difficulty:'hard',q:'What is a suffix array?',options:['An array of suffixes stored normally','A sorted array of all suffixes of a string — enables O(m log n) string search','A reversed string array','A prefix tree'],answer:1,explain:"Suffix array: sorted array of starting indices of all suffixes of a string. With LCP array, enables O(m+log n) pattern matching. More space-efficient than suffix trees."},
{category:'ds',difficulty:'hard',q:'What is heavy-light decomposition?',options:['A graph compression','A tree decomposition breaking it into chains, enabling O(log²n) path queries','A sorting technique','A type of graph coloring'],answer:1,explain:"HLD decomposes a tree into heavy chains, then uses a segment tree on each chain. Enables O(log²n) queries and updates on tree paths. Common in competitive programming."},
{category:'ds',difficulty:'hard',q:'What is a treap?',options:['A trap in graph theory','A BST where nodes have random priorities, maintaining heap order on priorities for expected O(log n)','A tree and array hybrid','A balanced search tree'],answer:1,explain:"Treap = tree + heap. Each node has a key (BST ordered) and a random priority (heap ordered). The random priorities keep the tree balanced in expectation. Simple to implement."},
{category:'ds',difficulty:'hard',q:'What is lock-free data structure?',options:['A data structure with no mutexes needed, using atomic operations for thread safety without blocking','A data structure with no locks in its name','An immutable data structure','A data structure for single-threaded use'],answer:0,explain:"Lock-free structures use atomic CPU operations (compare-and-swap) instead of locks. Other threads can always make progress — no thread can be blocked by another failing. Highly concurrent."},
{category:'ds',difficulty:'hard',q:'What is a rope data structure?',options:['A linked list of characters','A tree structure for efficiently storing and manipulating long strings','A graph for network problems','A type of queue'],answer:1,explain:"Rope: binary tree where leaves are strings and internal nodes store total length. Enables O(log n) concatenation and splitting of strings. Used in text editors for large documents."},
{category:'ds',difficulty:'hard',q:'What is cache-oblivious algorithm/structure?',options:['An algorithm unaware of cache size that is still cache-efficient for any cache size','An algorithm that ignores caching','A structure stored in cache','A type of hash table'],answer:0,explain:"Cache-oblivious: designed to work efficiently for any cache size without knowing the cache parameters. Uses recursive divide-and-conquer so data is naturally accessed in cache-sized blocks."},
{category:'ds',difficulty:'hard',q:'What is the time complexity of a balanced BST for all basic operations?',options:['O(1)','O(log n)','O(n)','O(n log n)'],answer:1,explain:"Balanced BST (AVL, Red-Black): search, insert, delete are all O(log n) guaranteed. The balance property ensures height stays O(log n)."},
{category:'ds',difficulty:'hard',q:'What is a k-d tree?',options:['A tree with k levels','A space-partitioning tree for organizing points in k-dimensional space','A tree with k children per node','A B-tree variant'],answer:1,explain:"k-d tree: binary tree where each level splits on a different dimension. Used for nearest neighbor search, range queries in geometric/spatial data. O(log n) average search."},
{category:'ds',difficulty:'hard',q:'What is amortized O(1) for dynamic array append?',options:['Each append is O(1)','Most appends are O(1), occasional O(n) resize, but average cost per operation is O(1)','O(1) only for small arrays','O(1) for the first append'],answer:1,explain:"Dynamic arrays double in size when full. Resize is O(n) but rare. Amortized analysis: total cost for n appends = O(n), so cost per append = O(1) amortized."},
{category:'ds',difficulty:'hard',q:'What is a 2-3 tree?',options:['A tree with 2-3 levels','A balanced tree where every node has 2 or 3 children and all leaves are at same depth','A tree that is a subset of B-tree','A Red-Black tree variant'],answer:1,explain:"2-3 tree: every internal node has 2 or 3 children, all leaves at same depth. Perfectly balanced. More conceptual than practical — B-trees and Red-Black trees are used instead."},
{category:'ds',difficulty:'hard',q:'What is the key insight behind the union by rank optimization in DSU?',options:['Always unite smaller to larger','Attach smaller tree under root of taller tree to keep overall height O(log n)','Randomly choose which tree to attach','Always attach to left'],answer:1,explain:"Union by rank attaches the shorter tree under the root of the taller tree. This keeps the height bounded at O(log n), preventing degenerate linear chains."},
{category:'ds',difficulty:'hard',q:'What makes a graph a DAG?',options:['It has directed edges','It is Directed and Acyclic — no path leads back to the starting node','It is fully connected','It has no weights'],answer:1,explain:"DAG = Directed Acyclic Graph. It has directed edges and no cycles. DAGs can be topologically sorted. Used for dependency resolution, build systems, scheduling."},
{category:'ds',difficulty:'hard',q:'What is a memory pool?',options:['RAM','Pre-allocated block of memory for fast allocation of fixed-size objects, avoiding malloc overhead','A cache','A garbage collector'],answer:1,explain:"Memory pool pre-allocates a large block and hands out fixed-size chunks from it. Avoids heap fragmentation and repeated malloc/free overhead. Used in game engines, embedded systems."},
{category:'algo',difficulty:'easy',q:'What is linear search?',options:['Searching only the first element','Checking each element one by one until found','Searching in a straight line in memory','Sorting then searching'],answer:1,explain:"Linear search checks each element sequentially. O(n) worst case. Works on unsorted data. Simple but slow for large datasets."},
{category:'algo',difficulty:'easy',q:'What is required for binary search to work?',options:['The list must be sorted','The list must have an even number of elements','The list must be small','The list must contain integers'],answer:0,explain:"Binary search REQUIRES a sorted list. It divides the search space in half each time by comparing with the middle element."},
{category:'algo',difficulty:'easy',q:'What is O(n log n)?',options:['Faster than O(n)','Slower than O(n) but faster than O(n²)','Same as O(n)','Slower than O(n²)'],answer:1,explain:"O(n log n) sits between O(n) and O(n²). Most efficient comparison-based sorting algorithms (merge sort, heap sort, quicksort average) are O(n log n)."},
{category:'algo',difficulty:'easy',q:'What is bubble sort?',options:['Sorting by size of bubbles','Repeatedly swapping adjacent elements that are out of order','Sorting by pushing elements to the end','A divide and conquer sort'],answer:1,explain:"Bubble sort: repeatedly compare adjacent pairs and swap if out of order. Each pass bubbles the largest element to the end. O(n²) — simple but inefficient."},
{category:'algo',difficulty:'easy',q:'What is the base case in a recursive function?',options:['The last line of the function','The condition that stops recursion — without it, the function calls itself forever','The first call to the function','The return value'],answer:1,explain:"Base case: the simplest input the function can solve directly without recursing. e.g. factorial(0) = 1. Without a base case, recursion never ends — stack overflow."},
{category:'algo',difficulty:'easy',q:'What is the time complexity of selection sort?',options:['O(n)','O(n log n)','O(n²)','O(log n)'],answer:2,explain:"Selection sort: find the minimum, swap it to front, repeat for remaining. Always O(n²) — does n selections, each scanning n elements. No best-case optimization."},
{category:'algo',difficulty:'easy',q:'What is an in-place algorithm?',options:['An algorithm run locally','An algorithm that sorts data using O(1) extra memory','An algorithm that never uses functions','An algorithm with no loops'],answer:1,explain:"In-place: uses only O(1) extra space beyond the input. Bubble sort, insertion sort, and selection sort are in-place. Merge sort is NOT (needs O(n) extra space)."},
{category:'algo',difficulty:'easy',q:'What is a stable sort?',options:['A sort that never crashes','A sort that preserves the relative order of equal elements','A sort that always produces the same result','A sort with O(n) complexity'],answer:1,explain:"Stable sort: equal elements maintain their original relative order. Merge sort and insertion sort are stable. Quick sort and heap sort are typically not stable."},
{category:'algo',difficulty:'easy',q:'What is a brute force algorithm?',options:['A fast algorithm','Trying all possible solutions','An algorithm using violence','A random algorithm'],answer:1,explain:"Brute force: try every possible solution and pick the best/correct one. Simple but often very slow. e.g. checking all pairs for duplicates is O(n²) brute force."},
{category:'algo',difficulty:'easy',q:'What does O(1) space mean?',options:['Uses 1 byte of memory','Uses constant memory regardless of input size','Uses no memory','Uses 1 variable'],answer:1,explain:"O(1) space complexity means the algorithm uses a fixed amount of extra memory regardless of input size. In-place algorithms typically use O(1) space."},
{category:'algo',difficulty:'easy',q:'What is insertion sort?',options:['Inserting elements into a new list','Building a sorted list one element at a time by inserting each into its correct position','Sorting by insertion order','Inserting duplicates'],answer:1,explain:"Insertion sort: take each element and insert it into its correct position in the sorted portion. O(n²) worst case, O(n) best case (already sorted). Good for small or nearly-sorted arrays."},
{category:'algo',difficulty:'easy',q:'What is the worst case for linear search?',options:['Item is at the front','Item is not in the list or is at the end','List is sorted','List is empty'],answer:1,explain:"Linear search worst case: item is at the last position or not present at all — must check every element. O(n)."},
{category:'algo',difficulty:'easy',q:'What is a two-pointer technique?',options:['Using two functions','Using two index variables that move toward each other or in the same direction through an array','Using two separate arrays','A type of linked list'],answer:1,explain:"Two pointers: use two index variables to scan an array. One common pattern: left starts at 0, right at end, move toward each other. Used for pair sum, reversing, palindrome check."},
{category:'algo',difficulty:'easy',q:'What is factorial of n (n!)?',options:['n + (n-1) + ... + 1','n × (n-1) × ... × 1','n²','2ⁿ'],answer:1,explain:"n! = n × (n-1) × (n-2) × ... × 1. e.g. 5! = 5×4×3×2×1 = 120. Used in counting problems. Grows extremely fast — 20! ≈ 2.4 quintillion."},
{category:'algo',difficulty:'easy',q:'What is the sliding window technique?',options:['Moving a window across the screen','Maintaining a fixed or variable-size window of elements as you scan through an array','A GUI technique','A graph traversal'],answer:1,explain:"Sliding window: maintain a subset (window) of elements, slide it across the array. Avoids recomputing from scratch each time. Used for max/min subarray, substring problems."},
{category:'algo',difficulty:'easy',q:'What is the Fibonacci sequence?',options:['1,2,3,5,8 — each number is the sum of the two before it','1,2,4,8 — each doubles','1,3,5,7 — odd numbers','2,4,6,8 — even numbers'],answer:0,explain:"Fibonacci: each number is the sum of the two preceding ones. F(0)=0, F(1)=1, F(2)=1, F(3)=2, F(4)=3, F(5)=5, F(6)=8... Classic recursion teaching example."},
{category:'algo',difficulty:'easy',q:'What is an off-by-one error?',options:['A hardware fault','A logic error where a loop runs one iteration too many or too few','Using the wrong variable','A division error'],answer:1,explain:"Off-by-one: classic bug where a boundary condition is wrong by 1. e.g. using < instead of <=, or range(n) when you need range(n+1). Very common and easy to overlook."},
{category:'algo',difficulty:'easy',q:'What is the time complexity of accessing array element by index?',options:['O(n)','O(log n)','O(1)','O(n²)'],answer:2,explain:"Array access by index is O(1) — direct memory calculation: address = base + index × element_size. No searching required."},
{category:'algo',difficulty:'easy',q:'What is a comparison sort?',options:['Sorting strings alphabetically','A sorting algorithm that determines order by comparing elements','Sorting by object size','A type of merge sort'],answer:1,explain:"Comparison sorts (bubble, merge, quick, heap) determine order by comparing elements. Lower bound: O(n log n). Non-comparison sorts (counting, radix) can beat this."},
{category:'algo',difficulty:'easy',q:'What does it mean for an algorithm to be greedy?',options:['It uses a lot of memory','It makes the locally optimal choice at each step, hoping to find a global optimum','It is always the fastest','It tries all possibilities'],answer:1,explain:"Greedy: make the best choice available right now without considering future consequences. Often (but not always) leads to optimal solutions. Efficient but may not always be correct."},
{category:'algo',difficulty:'medium',q:'What is merge sort\'s key advantage over quicksort?',options:['Faster on average','Guaranteed O(n log n) worst case and is stable','Uses less memory','Simpler to implement'],answer:1,explain:"Merge sort: always O(n log n) regardless of input. Stable. Quicksort averages O(n log n) but degrades to O(n²) worst case. Merge sort needs O(n) extra space though."},
{category:'algo',difficulty:'medium',q:'What is quicksort\'s partitioning step?',options:['Divides array in half','Picks a pivot; elements < pivot go left, elements > pivot go right','Sorts the first and last half','Swaps adjacent elements'],answer:1,explain:"Quicksort partition: choose a pivot, rearrange so all smaller elements are to its left and all larger to its right. Then recursively sort each side. Average O(n log n)."},
{category:'algo',difficulty:'medium',q:'What is dynamic programming?',options:['Programming with dynamic variables','Solving complex problems by breaking them into overlapping subproblems, storing results to avoid recomputation','A type of OOP','Programming that changes at runtime'],answer:1,explain:"DP: optimal substructure + overlapping subproblems. Store computed results (memoization or tabulation) to avoid redundant work. Classic: Fibonacci, knapsack, longest common subsequence."},
{category:'algo',difficulty:'medium',q:'What is the difference between memoization and tabulation?',options:['Same thing','Memoization: top-down DP with caching. Tabulation: bottom-up DP filling a table iteratively','Tabulation uses more memory','Memoization is always faster'],answer:1,explain:"Memoization (top-down): recursive + cache results on demand. Tabulation (bottom-up): fill DP table iteratively from base cases up. Both are O(n) for Fibonacci, but tabulation avoids recursion overhead."},
{category:'algo',difficulty:'medium',q:'What is Dijkstra\'s algorithm used for?',options:['Shortest path in unweighted graph','Shortest path from source to all vertices in weighted graph (non-negative weights)','Minimum spanning tree','Topological sort'],answer:1,explain:"Dijkstra finds shortest paths from a source to all other vertices in a weighted graph with non-negative weights. Uses a priority queue. Time: O((V+E) log V) with binary heap."},
{category:'algo',difficulty:'medium',q:'What is a greedy algorithm that doesn\'t always work optimally?',options:['Dijkstra','Activity selection','0/1 Knapsack','Huffman coding'],answer:2,explain:"0/1 Knapsack (take item or don't) requires DP — greedy fails. Fractional Knapsack (can take fractions) works with greedy. Activity selection, Huffman, Dijkstra are examples where greedy is optimal."},
{category:'algo',difficulty:'medium',q:'What is the 0/1 Knapsack problem?',options:['Fitting 0 and 1 bits','Given items with weights and values, maximize value in a weight-limited bag where items cannot be split','A sorting problem','A graph problem'],answer:1,explain:"0/1 Knapsack: for each item, either take it (1) or leave it (0) — can't take fractions. Classic DP problem with O(nW) time/space where n=items, W=capacity."},
{category:'algo',difficulty:'medium',q:'What is the Longest Common Subsequence (LCS)?',options:['Longest shared substring','Longest sequence of characters that appears in both strings in order (not necessarily contiguous)','Longest sorted sequence','Longest repeated element'],answer:1,explain:"LCS: find the longest subsequence present in both strings. Subsequence doesn't need to be contiguous. e.g. LCS('ABCBD', 'ACDB') = 'ACB' (length 3). Classic DP O(mn)."},
{category:'algo',difficulty:'medium',q:'What is the edit distance (Levenshtein distance)?',options:['String length difference','Minimum number of single-character edits (insert, delete, replace) to transform one string to another','Number of different characters','Number of matching characters'],answer:1,explain:"Edit distance: minimum operations to transform string A to B. Operations: insert, delete, replace (each costs 1). Classic DP O(mn). Used in spell checkers, diff tools, bioinformatics."},
{category:'algo',difficulty:'medium',q:'What is Kruskal\'s algorithm?',options:['Shortest path algorithm','Minimum spanning tree algorithm that adds edges in weight order, skipping those creating cycles','Graph coloring algorithm','Topological sort algorithm'],answer:1,explain:"Kruskal's: sort edges by weight, add each to MST if it doesn't create a cycle (check with DSU). O(E log E). Good for sparse graphs."},
{category:'algo',difficulty:'medium',q:'What is Prim\'s algorithm?',options:['Prime number finder','MST algorithm that grows a tree from a source by always adding the cheapest edge connecting tree to non-tree vertex','Shortest path algorithm','Graph traversal'],answer:1,explain:"Prim's: start from any vertex, always add minimum weight edge that connects the current tree to a new vertex. O(E log V) with priority queue. Good for dense graphs."},
{category:'algo',difficulty:'medium',q:'What is the coin change problem?',options:['Counting coin collections','Find the minimum number of coins to make a given amount','Sorting coins by value','A greedy always-optimal problem'],answer:1,explain:"Coin change: given coin denominations, find minimum coins to make target amount. Greedy fails for some coin systems. DP solution: O(amount × coins). Classic DP problem."},
{category:'algo',difficulty:'medium',q:'What is binary search time complexity?',options:['O(n)','O(log n)','O(n log n)','O(1)'],answer:1,explain:"Binary search: each comparison eliminates half the search space. After k comparisons, search space = n/2^k. Solving: k = log₂n. Time: O(log n). Space: O(1) iterative, O(log n) recursive."},
{category:'algo',difficulty:'medium',q:'What is the prefix sum technique?',options:['Adding prefix to strings','Precomputing cumulative sums so range queries become O(1)','Finding longest prefix','Sorting with prefix'],answer:1,explain:"Prefix sum: prefix[i] = arr[0]+arr[1]+...+arr[i]. Range sum query [l,r] = prefix[r] - prefix[l-1] in O(1). Build: O(n), query: O(1). Extremely useful."},
{category:'algo',difficulty:'medium',q:'What is the Floyd-Warshall algorithm?',options:['Shortest path from one source','All-pairs shortest paths — finds shortest path between every pair of vertices','Graph coloring','Cycle detection'],answer:1,explain:"Floyd-Warshall: O(V³) DP algorithm finding shortest paths between ALL pairs of vertices. Works with negative edges (but not negative cycles). dist[i][j][k] = shortest using vertices 0..k."},
{category:'algo',difficulty:'medium',q:'What is amortized analysis?',options:['Analyzing the average case','Analyzing total cost of a sequence of operations divided by number of operations','Statistical analysis','Worst-case analysis'],answer:1,explain:"Amortized analysis: total cost of n operations / n. Even if some operations are expensive, if they're rare, the amortized cost per operation may be cheap. e.g. dynamic array append."},
{category:'algo',difficulty:'medium',q:'What is the Bellman-Ford algorithm?',options:['Shortest path for positive weights','Shortest path from source that handles negative weights and detects negative cycles','MST algorithm','BFS variant'],answer:1,explain:"Bellman-Ford: O(VE) shortest path that handles negative edge weights. Relaxes all edges V-1 times. Can detect negative cycles (if further relaxation is possible after V-1 rounds)."},
{category:'algo',difficulty:'medium',q:'What is counting sort?',options:['Sorting by counting comparisons','O(n+k) sorting by counting occurrences of each value — not comparison based','Sorting by counting passes','A stable sort using comparison'],answer:1,explain:"Counting sort: count occurrences of each value (0 to k), compute cumulative counts, place elements. O(n+k) time and space. Beats O(n log n) barrier for integers in small range."},
{category:'algo',difficulty:'medium',q:'What is a rolling hash?',options:['A hash that rotates values','Efficient technique to update hash value when a window slides by one — O(1) rehash instead of O(m)','A hash for circular data','A hash that changes periodically'],answer:1,explain:"Rolling hash: update hash by removing old element's contribution and adding new one. Used in Rabin-Karp string matching and sliding window substring problems."},
{category:'algo',difficulty:'medium',q:'What is the activity selection problem?',options:['Choosing the best programming activity','Select maximum number of non-overlapping activities — greedy: always pick earliest finishing activity','Scheduling CPU tasks','Graph problem'],answer:1,explain:"Activity selection: given activities with start/end times, select maximum non-overlapping set. Greedy: sort by end time, always pick earliest-finishing activity that doesn't overlap. Provably optimal."},
{category:'algo',difficulty:'medium',q:'What is divide and conquer?',options:['Dividing by zero','Breaking a problem into subproblems, solving them, combining results','A team programming technique','A database strategy'],answer:1,explain:"Divide and Conquer: 1) Divide problem into smaller subproblems, 2) Conquer (solve) each recursively, 3) Combine results. Examples: merge sort, quicksort, binary search, FFT."},
{category:'algo',difficulty:'medium',q:'What is a topological sort used for?',options:['Sorting alphabetically','Ordering tasks where some must precede others — dependency ordering','Sorting a BST','Sorting graphs by weight'],answer:1,explain:"Topological sort orders vertices in a DAG such that for every edge u→v, u comes before v. Used in build systems, course prerequisites, task scheduling. Not unique — multiple valid orderings possible."},
{category:'algo',difficulty:'medium',q:'What is the time complexity of heap sort?',options:['O(n)','O(n log n)','O(n²)','O(log n)'],answer:1,explain:"Heap sort: build max-heap O(n), then extract max n times O(n log n). Total: O(n log n) worst case. In-place (O(1) extra space) but not stable. Consistently O(n log n) unlike quicksort."},
{category:'algo',difficulty:'medium',q:'What is two-sum problem solution in O(n)?',options:['Sort and binary search','Use a hash set: for each element x, check if (target - x) is in the set','Check all pairs','Use two pointers on unsorted'],answer:1,explain:"O(n) solution: iterate through, storing seen numbers in a hash set. For each x, check if (target-x) exists in set. O(n) time, O(n) space. Better than O(n log n) sort + two-pointer."},
{category:'algo',difficulty:'medium',q:'What is memoization?',options:['Writing notes about an algorithm','Caching the results of expensive function calls so repeated calls with same arguments are O(1)','A type of memory management','Storing all function calls'],answer:1,explain:"Memoization: cache function results by input. If called again with same input, return cached result. Converts exponential recursive algorithms to polynomial. Python: use @lru_cache or a dict."},
{category:'algo',difficulty:'medium',q:'What is radix sort?',options:['Sorting by radix (root)','Sorting digit by digit from least to most significant — O(nk) non-comparison sort','A recursive sort','A type of counting sort'],answer:1,explain:"Radix sort: sort by each digit position using a stable sort. O(nk) where k=number of digits. Can sort n integers in O(n) if k=O(1). Non-comparison — beats O(n log n) barrier."},
{category:'algo',difficulty:'medium',q:'What is the maximum subarray problem?',options:['Finding the largest element','Find the contiguous subarray with maximum sum — Kadane\'s algorithm solves in O(n)','Finding the longest subarray','A two-pointer problem'],answer:1,explain:"Maximum subarray: find contiguous subarray with largest sum. Kadane's: track current sum and max sum. At each step: current = max(arr[i], current + arr[i]). O(n) time, O(1) space."},
{category:'algo',difficulty:'medium',q:'What is Kadane\'s algorithm?',options:['Sorting algorithm','O(n) algorithm for maximum subarray sum using dynamic programming','Graph traversal algorithm','String matching algorithm'],answer:1,explain:"Kadane's: max_ending_here = max(arr[i], max_ending_here + arr[i]); max_so_far = max(max_so_far, max_ending_here). The insight: extend current subarray or start fresh, whichever is larger."},
{category:'algo',difficulty:'medium',q:'What is the time complexity of building a binary heap?',options:['O(n log n)','O(n)','O(log n)','O(n²)'],answer:1,explain:"Building a heap from an unsorted array is O(n) — not O(n log n). Start from last non-leaf, sift down each node. Nodes near leaves do little work. This is why heap sort starts with O(n) heapify."},
{category:'algo',difficulty:'hard',q:'What is NP-completeness?',options:['A problem with no solution','A class of decision problems where any solution can be verified in polynomial time and every NP problem reduces to it','Problems solvable in polynomial time','Non-polynomial problems'],answer:1,explain:"NP-complete: hardest problems in NP. If you can solve one NP-complete problem in polynomial time, ALL NP problems are solvable in polynomial time (P=NP). Examples: 3-SAT, TSP, knapsack."},
{category:'algo',difficulty:'hard',q:'What is the KMP string matching algorithm?',options:['Brute force string search','O(n+m) string search using a failure function to avoid re-examining characters','A hashing approach to string matching','Binary search on strings'],answer:1,explain:"KMP: precompute 'failure function' (LPS array) for pattern in O(m). Search text in O(n). Total O(n+m) vs O(nm) brute force. Key: when mismatch occurs, use failure function to skip characters."},
{category:'algo',difficulty:'hard',q:'What is the convex hull problem?',options:['Optimizing a convex function','Finding the smallest convex polygon containing all given points','A graph problem','A sorting problem'],answer:1,explain:"Convex hull: find the smallest convex polygon enclosing a set of 2D points. Algorithms: Graham scan O(n log n), Jarvis March O(nh). Used in computational geometry, collision detection."},
{category:'algo',difficulty:'hard',q:'What is network flow?',options:['Network speed measurement','Finding maximum flow through a network from source to sink','Graph coloring','Shortest path in networks'],answer:1,explain:"Network flow: find max flow from source s to sink t in a capacity-constrained directed graph. Ford-Fulkerson: O(Ef) or O(VE²) with Edmonds-Karp. Applications: bipartite matching, scheduling."},
{category:'algo',difficulty:'hard',q:'What is the min-cut max-flow theorem?',options:['Minimum edges to cut = maximum path length','Maximum flow from s to t equals minimum capacity cut separating s and t','Minimum spanning tree equals maximum flow','A graph duality theorem'],answer:1,explain:"Max-flow min-cut: the maximum flow in a network equals the minimum capacity of any cut separating source from sink. Fundamental theorem used in network analysis and matching problems."},
{category:'algo',difficulty:'hard',q:'What is a Las Vegas algorithm?',options:['A gambling algorithm','Randomized algorithm that always gives correct answer but running time is random','Randomized algorithm with probability of correct answer','An approximation algorithm'],answer:1,explain:"Las Vegas: always correct, but runtime varies randomly. e.g. randomized quicksort — always sorts correctly, but time depends on pivot choices. Contrast with Monte Carlo: fixed time, may be wrong."},
{category:'algo',difficulty:'hard',q:'What is bitmask DP?',options:['DP using bit manipulation','DP where state is represented as a bitmask — each bit represents inclusion/exclusion of an element','DP on binary trees','DP with bitwise operations only'],answer:1,explain:"Bitmask DP: state = bitmask of which elements have been used. Used for TSP O(2^n × n²), set cover problems. Allows compact representation of subsets. Feasible only for small n (~20)."},
{category:'algo',difficulty:'hard',q:'What is the Fast Fourier Transform (FFT)?',options:['A fast sorting algorithm','O(n log n) algorithm for computing Discrete Fourier Transform — used for polynomial multiplication','A graph algorithm','A compression algorithm'],answer:1,explain:"FFT computes DFT in O(n log n) vs O(n²) naively. Applications: polynomial multiplication, signal processing, image compression. Cooley-Tukey is the classic divide-and-conquer FFT."},
{category:'algo',difficulty:'hard',q:'What is an approximation algorithm?',options:['An algorithm that is approximately correct','An algorithm giving a solution within a guaranteed factor of optimal — used when exact solution is NP-hard','A randomized algorithm','A heuristic with no guarantee'],answer:1,explain:"Approximation algorithm: provably finds a solution within a known factor of optimal. e.g. 2-approximation for vertex cover. Useful for NP-hard problems where exact solutions are infeasible."},
{category:'algo',difficulty:'hard',q:'What is the significance of P vs NP?',options:['A math puzzle','Whether every problem whose solution can be verified in polynomial time can also be SOLVED in polynomial time','A hardware problem','A memory management question'],answer:1,explain:"P vs NP: P = problems solvable in polynomial time. NP = problems verifiable in polynomial time. P=NP would mean all NP problems are efficiently solvable. Most believe P≠NP. Greatest open problem in CS."},
{category:'algo',difficulty:'hard',q:'What is heavy-light decomposition used for?',options:['Graph compression','Efficiently querying/updating paths in trees by decomposing into chains — O(log²n) path queries','Balancing trees','Network flow optimization'],answer:1,explain:"HLD decomposes a tree into heavy chains. Path queries become range queries on chains using a segment tree. Enables O(log²n) per query for path sum/min/max. Used in competitive programming."},
{category:'algo',difficulty:'hard',q:'What is a suffix automaton?',options:['An automaton for suffixes of words','The smallest automaton accepting all suffixes of a string — enables O(n) construction and many string queries','A trie for suffixes','A compressed suffix tree'],answer:1,explain:"Suffix automaton (SAM): minimal DFA accepting all suffixes of string s. O(n) construction, O(n) space (up to 2n states). Enables O(m) substring search, counting distinct substrings, and more."},
{category:'algo',difficulty:'hard',q:'What is centroid decomposition?',options:['Finding the center of a graph','Recursively removing centroids from a tree, enabling O(n log n) processing of tree path problems','Balancing a BST','Finding the heaviest node'],answer:1,explain:"Centroid decomposition: find centroid (removing it splits tree into components of ≤ n/2), process all paths through centroid, recurse on components. Depth O(log n). Total: O(n log n)."},
{category:'algo',difficulty:'hard',q:'What is the Rabin-Karp algorithm?',options:['A sorting algorithm','String matching using rolling hash — O(n+m) average, O(nm) worst case','A graph algorithm','A data compression algorithm'],answer:1,explain:"Rabin-Karp: hash the pattern, slide hash over text using rolling hash. O(1) hash update per step. Average O(n+m), worst O(nm) if many hash collisions. Naturally extends to multiple pattern search."},
{category:'algo',difficulty:'hard',q:'What is the longest increasing subsequence (LIS)?',options:['The longest sorted subarray','The longest subsequence where each element is greater than the previous — O(n log n) solution exists','The longest run of unique elements','The longest subarray'],answer:1,explain:"LIS: find longest subsequence where each element strictly increases. O(n²) DP or O(n log n) with patience sorting + binary search. Classic problem in DP and interview questions."},
{category:'algo',difficulty:'hard',q:'What is a segment tree with lazy propagation?',options:['A slow segment tree','Range update + range query in O(log n) by deferring updates — push down when needed','A segment tree with cached values','A two-pointer technique'],answer:1,explain:"Lazy propagation: instead of updating all affected nodes, mark them as 'lazy' (pending update). Push down laziness when you need to go deeper. Enables range updates AND range queries in O(log n)."},
{category:'algo',difficulty:'hard',q:'What is the Hungarian algorithm?',options:['An Eastern European sorting method','O(n³) algorithm for optimal assignment problem — minimum cost perfect matching in bipartite graphs','A graph traversal','A shortest path variant'],answer:1,explain:"Hungarian algorithm: solves assignment problem — assign n workers to n jobs minimizing total cost. O(n³). Fundamental in operations research, tracking algorithms, auction theory."},
{category:'algo',difficulty:'hard',q:'What is the Aho-Corasick algorithm?',options:['A sorting algorithm','Multi-pattern string matching in O(n + m + z) using a trie with failure links','A single pattern search','A compression algorithm'],answer:1,explain:"Aho-Corasick: builds automaton from multiple patterns (trie + failure links), searches text once finding all pattern occurrences in O(n + m + z). Used in antivirus, DNA search."},
{category:'algo',difficulty:'hard',q:'What is sqrt decomposition?',options:['Dividing by square root','Dividing array into √n blocks for O(√n) range queries — simpler than segment tree','Square root algorithm','A divide and conquer variant'],answer:1,explain:"Sqrt decomposition: split array into √n blocks, precompute block answers. Range queries: handle partial blocks element-by-element, full blocks with precomputed values. O(√n) per query, O(n) build."},
{category:'algo',difficulty:'hard',q:'What is the time complexity of matrix chain multiplication DP?',options:['O(n)','O(n²)','O(n³)','O(2ⁿ)'],answer:2,explain:"Matrix chain multiplication: find optimal parenthesization to minimize scalar multiplications. DP with 3 nested loops: O(n³) time, O(n²) space. Classic DP — demonstrates need to try all split points."},
{category:'git',difficulty:'easy',q:'What does git init do?',options:['Downloads a repository','Creates a new empty Git repository in the current folder','Connects to GitHub','Commits all files'],answer:1,explain:"git init initializes a new Git repository, creating a hidden .git folder that tracks all changes. Run this once in your project folder to start version control."},
{category:'git',difficulty:'easy',q:'What does git status show?',options:['System CPU status','Which files are modified, staged, or untracked','List of all commits','Branch history'],answer:1,explain:"git status shows the working tree status: which files are modified (but not staged), staged (ready to commit), or untracked (Git doesn't know about them yet)."},
{category:'git',difficulty:'easy',q:'What does git add . do?',options:['Adds a new file named .','Stages ALL changes in the current directory for the next commit','Commits everything','Pushes everything'],answer:1,explain:"git add . stages all changes (new, modified, deleted files) in the current directory and subdirectories. The dot means 'everything here.'"},
{category:'git',difficulty:'easy',q:'What is a commit message?',options:['A system notification','A description of what changes you made — best practice: short, imperative, present tense','An email to collaborators','A type of branch'],answer:1,explain:"Commit message describes what the commit does. Convention: imperative mood, ~50 chars summary. e.g. 'Add user authentication' not 'Added user auth'. Good messages make history readable."},
{category:'git',difficulty:'easy',q:'What does git log --oneline show?',options:['One log file','Each commit on one line: short hash + message','Only the last commit','A graph of branches'],answer:1,explain:"--oneline format: abbreviated commit hash + first line of commit message. Great for a quick overview of commit history without the full details."},
{category:'git',difficulty:'easy',q:'What is the HEAD pointer in Git?',options:['The first commit ever','A pointer to the currently checked-out commit/branch','The latest commit on main','A type of tag'],answer:1,explain:"HEAD points to your current position in the repository — usually the tip of the current branch. When you make a commit, HEAD moves forward. Detached HEAD means HEAD points to a specific commit, not a branch."},
{category:'git',difficulty:'easy',q:'What does git diff show?',options:['Difference between two files on disk','Differences between working directory and last commit (unstaged changes)','Difference between branches','Size difference'],answer:1,explain:"git diff shows unstaged changes — what's different between your working files and the last committed version. git diff --staged shows staged (to be committed) changes."},
{category:'git',difficulty:'easy',q:'What does .gitignore do?',options:['Ignores all Git commands','Specifies files/patterns Git should not track','Deletes Git history','Hides the .git folder'],answer:1,explain:".gitignore lists files/patterns Git should ignore (not track, not commit). e.g. node_modules/, *.pyc, .env, __pycache__/. Each line is a pattern."},
{category:'git',difficulty:'easy',q:'What does git checkout -- filename do?',options:['Switches branches','Discards changes to a file, restoring it to last committed state','Creates a new file','Copies a file'],answer:1,explain:"git checkout -- filename discards unstaged changes to that file, restoring the last committed version. Warning: this is destructive — changes are lost permanently."},
{category:'git',difficulty:'easy',q:'What is origin in Git?',options:['The beginning of time','The default name for the remote repository (usually GitHub/GitLab)','The main branch','The first commit'],answer:1,explain:"origin is the default name given to the remote repository when you clone. git push origin main pushes to the main branch of the remote called origin."},
{category:'git',difficulty:'easy',q:'What does git fetch do?',options:['Fetches files from the internet','Downloads changes from remote WITHOUT merging them into your branch','Same as git pull','Fetches only metadata'],answer:1,explain:"git fetch downloads new commits from remote but doesn't modify your working branch. You can then review before merging. git pull = git fetch + git merge."},
{category:'git',difficulty:'easy',q:'What is a remote in Git?',options:['A distant server','A version of the repository hosted on the internet or network (like GitHub)','A branch that is far behind','A deleted branch'],answer:1,explain:"A remote is a reference to a version of the repository on another machine/server. Allows collaboration. Common commands: git remote add, git fetch, git push, git pull."},
{category:'git',difficulty:'easy',q:'What does git branch -d branchname do?',options:['Creates a branch','Deletes a local branch (safe — only works if branch is merged)','Renames a branch','Lists all branches'],answer:1,explain:"git branch -d deletes a local branch safely — only succeeds if the branch has been merged. Use -D to force delete even if unmerged."},
{category:'git',difficulty:'easy',q:'What does git checkout -b newbranch do?',options:['Checks out a file','Creates a new branch and immediately switches to it','Lists branches','Merges a branch'],answer:1,explain:"git checkout -b is shorthand for: 1) git branch newbranch, 2) git checkout newbranch. Modern equivalent: git switch -c newbranch."},
{category:'git',difficulty:'easy',q:'What is a pull request (PR)?',options:['A request to download files','A request to merge your branch into another branch — allows code review before merging','A request for help','Fetching from remote'],answer:1,explain:"A PR (GitHub) or Merge Request (GitLab) asks maintainers to review and merge your branch. Enables code review, discussion, CI checks before changes land in main."},
{category:'git',difficulty:'easy',q:'What does git remote -v show?',options:['Git version','List of remotes with their URLs (fetch and push)','Verbose commit log','All branches including remotes'],answer:1,explain:"git remote -v lists all configured remotes and their fetch/push URLs. Useful for verifying which GitHub repo you're connected to."},
{category:'git',difficulty:'easy',q:'What is a tag in Git?',options:['A label on a file','A named pointer to a specific commit — used for marking releases (v1.0, v2.0)','A type of branch','A commit with extra info'],answer:1,explain:"Tags mark specific commits as important — typically used for release versions. Unlike branches, tags don't move when new commits are added. git tag v1.0 creates a lightweight tag."},
{category:'git',difficulty:'easy',q:'What does git show HEAD show?',options:['System info','Details of the most recent commit: message, author, date, diff','List of all commits','Current branch name'],answer:1,explain:"git show HEAD displays the most recent commit's metadata (author, date, message) plus the diff of changes it introduced."},
{category:'git',difficulty:'easy',q:'What does git push origin main do?',options:['Downloads main branch','Uploads your local main branch commits to the remote repository','Creates main branch','Merges main branch'],answer:1,explain:"git push origin main sends your local commits from the main branch to the remote named origin. Others can then pull your changes."},
{category:'git',difficulty:'easy',q:'What does "detached HEAD" mean?',options:['Git is broken','HEAD points directly to a commit rather than a branch — commits made here are easily lost','HEAD was deleted','A corrupted repository'],answer:1,explain:"Detached HEAD: you checked out a specific commit instead of a branch. New commits won't be on any branch and may be garbage-collected. Create a branch to keep your work: git switch -c new-branch."},
{category:'git',difficulty:'medium',q:'What is git rebase?',options:['Going back to a base commit','Reapplying commits from one branch onto another, creating a linear history','Merging two branches','Resetting to base'],answer:1,explain:"Rebase: take commits from your branch and replay them on top of another branch. Creates linear history (no merge commits). Rewrites commit history — don't rebase shared/public branches."},
{category:'git',difficulty:'medium',q:'What is git stash?',options:['Hiding files from Git','Temporarily saves uncommitted changes so you can switch branches without losing work','Deleting uncommitted changes','A type of commit'],answer:1,explain:"git stash saves dirty working directory state and reverts to clean state. Later: git stash pop restores the changes. Great for quick context switches."},
{category:'git',difficulty:'medium',q:'What is a fast-forward merge?',options:['A very quick merge','A merge where no new commit is needed because the target branch is a direct ancestor — just move the pointer','A merge with no conflicts','Merging large branches'],answer:1,explain:"Fast-forward: if the branch to merge hasn't diverged from the current branch, Git just moves the branch pointer forward — no merge commit needed. Results in linear history."},
{category:'git',difficulty:'medium',q:'What is git cherry-pick?',options:['Selecting files to delete','Applying a specific commit from one branch onto another branch','Choosing which files to stage','Selecting which branch to merge'],answer:1,explain:"git cherry-pick applies the changes from a specific commit onto the current branch. Useful for backporting bug fixes without merging an entire branch."},
{category:'git',difficulty:'medium',q:'What does git reset --hard HEAD~1 do?',options:['Soft undo last commit','Completely removes last commit AND its changes from working directory — destructive!','Resets only the staging area','Moves HEAD back one but keeps changes'],answer:1,explain:"--hard: resets HEAD, staging area, AND working directory to the specified commit. Changes are GONE. git reset --soft HEAD~1 undoes commit but keeps changes staged."},
{category:'git',difficulty:'medium',q:'What does git revert do?',options:['Undoes all commits','Creates a new commit that undoes the changes of a specific commit — safe for public branches','Deletes a branch','Restores deleted files'],answer:1,explain:"git revert creates a new commit that is the inverse of the specified commit. Safe for public branches (doesn't rewrite history). vs git reset which rewrites history."},
{category:'git',difficulty:'medium',q:'What is a three-way merge?',options:['Merging three branches at once','A merge using the two branch tips AND their common ancestor to reconcile changes','A merge with three conflicts','A type of rebase'],answer:1,explain:"Three-way merge: uses the two branch tips and their common ancestor. Git finds what changed in each branch since the split and combines them. Creates a merge commit with two parents."},
{category:'git',difficulty:'medium',q:'What is git blame used for?',options:['Blaming teammates','Shows who last modified each line of a file — useful for tracking when/by whom a line was changed','Finding bugs','Reviewing commits'],answer:1,explain:"git blame annotates each line of a file with the commit hash, author, and date of the last modification. Great for understanding why a line is the way it is."},
{category:'git',difficulty:'medium',q:'What is a fork?',options:['A git command','A personal copy of someone else\'s repository on your GitHub account — allows you to contribute via PRs','Branching a repository','Cloning locally'],answer:1,explain:"Fork creates your own copy of a repo on GitHub. You make changes in your fork, then submit a PR to the original. Standard workflow for contributing to open source."},
{category:'git',difficulty:'medium',q:'What is branch protection?',options:['Encrypting a branch','Rules preventing certain actions on important branches (e.g. require PR review before merging to main)','Making a branch read-only','Hiding a branch'],answer:1,explain:"Branch protection rules (GitHub/GitLab): require PR reviews, passing CI, no direct pushes to main. Enforces code quality and prevents accidental force-pushes to production branches."},
{category:'git',difficulty:'medium',q:'What does git merge --no-ff do?',options:['Merges without conflicts','Forces a merge commit even when fast-forward is possible — preserves branch history','Cancels a merge','Merges without checking conflicts'],answer:1,explain:"--no-ff: no fast-forward. Forces creation of a merge commit even if fast-forward is possible. Preserves the history that a feature branch existed. Often preferred for feature branches."},
{category:'git',difficulty:'medium',q:'What is an interactive rebase?',options:['A rebase with UI','git rebase -i: allows editing, reordering, squashing, or dropping commits before rebasing','A rebase that asks questions','A conflict-free rebase'],answer:1,explain:"Interactive rebase (git rebase -i HEAD~n): opens editor showing last n commits. You can: pick (keep), reword (edit message), squash (combine), drop (delete). Powerful history editing tool."},
{category:'git',difficulty:'medium',q:'What is squashing commits?',options:['Deleting commits','Combining multiple commits into one — cleans up messy WIP commits into a single meaningful commit','Compressing commit data','Sorting commits'],answer:1,explain:"Squash: combine multiple commits into one. Common before merging a PR — squash all your 'WIP', 'fix typo' commits into one clean commit. Done via interactive rebase or git merge --squash."},
{category:'git',difficulty:'hard',q:'What is git bisect?',options:['Cutting a branch in half','Binary search through commit history to find the commit that introduced a bug','Dividing the repository','A type of merge'],answer:1,explain:"git bisect performs binary search through commits. Mark a good and bad commit; Git checks out midpoints for you to test. Finds the offending commit in O(log n) steps."},
{category:'git',difficulty:'hard',q:'What is git reflog?',options:['A reference log file','A log of all HEAD movements — recovers seemingly lost commits, branches, or resets','A remote log','A blame log'],answer:1,explain:"Reflog records every time HEAD changes. Recovers 'lost' commits after reset or checkout. git reflog shows the history; git checkout <hash> recovers work. Entries expire after ~90 days."},
{category:'git',difficulty:'hard',q:'What are Git hooks?',options:['Hanging points in code','Scripts that run automatically before/after Git events (commit, push, merge) — for automation and enforcement','A plugin system','Remote webhooks'],answer:1,explain:"Git hooks: scripts in .git/hooks/ that run at specific events. pre-commit: run linter/tests before commit. commit-msg: enforce message format. post-push: trigger deployments. Not versioned by default."},
{category:'git',difficulty:'hard',q:'What is a Git submodule?',options:['A small module in Python','A repository embedded inside another — allows referencing another repo at a specific commit','A branch inside a branch','A compressed repository'],answer:1,explain:"Submodules: embed one Git repository inside another, pinned to a specific commit. Used for dependencies you want to track at a specific version. Complex to manage — consider alternatives like package managers."},
{category:'git',difficulty:'hard',q:'What is git worktree?',options:['A working directory','Multiple working trees linked to one repository — check out different branches simultaneously without cloning','A type of stash','A branching strategy'],answer:1,explain:"git worktree add: check out a second (or more) branch in a separate directory from the same repository. No need to stash/commit before switching — both branches accessible simultaneously."},
{category:'math',difficulty:'easy',q:'What is 1101 in binary converted to decimal?',options:['11','12','13','15'],answer:2,explain:"1101 binary = 1×8 + 1×4 + 0×2 + 1×1 = 8+4+0+1 = 13."},
{category:'math',difficulty:'easy',q:'What is 15 in hexadecimal?',options:['E','F','10','14'],answer:1,explain:"Hex digits 0-9 then A=10, B=11, C=12, D=13, E=14, F=15. So 15 decimal = F hex."},
{category:'math',difficulty:'easy',q:'What is TRUE AND FALSE?',options:['TRUE','FALSE','ERROR','UNDEFINED'],answer:1,explain:"AND: both must be true. TRUE AND FALSE = FALSE. Truth table: T∧T=T, T∧F=F, F∧T=F, F∧F=F."},
{category:'math',difficulty:'easy',q:'What is FALSE OR TRUE?',options:['FALSE','TRUE','ERROR','UNDEFINED'],answer:1,explain:"OR: at least one must be true. FALSE OR TRUE = TRUE. Truth table: T∨T=T, T∨F=T, F∨T=T, F∨F=F."},
{category:'math',difficulty:'easy',q:'What is TRUE XOR TRUE?',options:['TRUE','FALSE','ERROR','UNDEFINED'],answer:1,explain:"XOR (exclusive or): true only when inputs differ. TRUE XOR TRUE = FALSE (they're the same). TRUE XOR FALSE = TRUE."},
{category:'math',difficulty:'easy',q:'What is 12 in binary?',options:['1010','1011','1100','1101'],answer:2,explain:"12 = 8+4 = 1×8 + 1×4 + 0×2 + 0×1 = 1100 in binary."},
{category:'math',difficulty:'easy',q:'How many values can 3 bits represent?',options:['3','6','8','16'],answer:2,explain:"n bits can represent 2ⁿ values. 3 bits = 2³ = 8 values (0-7)."},
{category:'math',difficulty:'easy',q:'What is a prime number?',options:['A number divisible by 2','A number divisible only by 1 and itself','An even number','A number with many factors'],answer:1,explain:"A prime number has exactly two factors: 1 and itself. e.g. 2, 3, 5, 7, 11, 13. 1 is NOT prime. 2 is the only even prime."},
{category:'math',difficulty:'easy',q:'What is 7 mod 4?',options:['1','2','3','0'],answer:2,explain:"7 ÷ 4 = 1 remainder 3. So 7 mod 4 = 3."},
{category:'math',difficulty:'easy',q:'What is the union of {1,2,3} and {2,3,4}?',options:['{2,3}','{1,2,3,4}','{1,4}','{1,2,3,2,3,4}'],answer:1,explain:"Union (A∪B): all elements in A or B or both, without duplicates. {1,2,3}∪{2,3,4} = {1,2,3,4}."},
{category:'math',difficulty:'easy',q:'What is the intersection of {1,2,3} and {2,3,4}?',options:['{1,4}','{2,3}','{1,2,3,4}','{}'],answer:1,explain:"Intersection (A∩B): only elements in BOTH A and B. {1,2,3}∩{2,3,4} = {2,3}."},
{category:'math',difficulty:'easy',q:'What is 0! (zero factorial)?',options:['0','1','undefined','infinity'],answer:1,explain:"0! = 1 by definition. This convention makes many combinatorics formulas work correctly. 1! = 1, 2! = 2, 3! = 6, etc."},
{category:'math',difficulty:'easy',q:'What is De Morgan\'s first law?',options:['NOT(A AND B) = (NOT A) AND (NOT B)','NOT(A AND B) = (NOT A) OR (NOT B)','NOT(A OR B) = (NOT A) AND (NOT B)','NOT(A OR B) = A AND B'],answer:1,explain:"De Morgan's 1st law: NOT(A AND B) = (NOT A) OR (NOT B). 2nd law: NOT(A OR B) = (NOT A) AND (NOT B). Essential for simplifying logical expressions."},
{category:'math',difficulty:'easy',q:'What is the power set of {a, b}?',options:['{a,b}','{{},{a},{b},{a,b}}','{{a},{b}}','{a,ab,b}'],answer:1,explain:"Power set: set of ALL subsets including empty set and the set itself. P({a,b}) = {∅, {a}, {b}, {a,b}}. Size of power set of n elements = 2ⁿ."},
{category:'math',difficulty:'easy',q:'What does P(n,r) (permutation) count?',options:['Combinations of r items','Ordered arrangements of r items chosen from n — order matters','Subsets of size r','Ways to arrange n items'],answer:1,explain:"P(n,r) = n!/(n-r)! — number of ways to arrange r items from n when order matters. e.g. choosing 1st, 2nd, 3rd from 10 people = P(10,3) = 720."},
{category:'math',difficulty:'easy',q:'What does C(n,r) (combination) count?',options:['Ordered selections','Unordered selections of r items from n — order does not matter','Permutations','Power sets'],answer:1,explain:"C(n,r) = n!/(r!(n-r)!) — choose r items from n when order doesn't matter. e.g. choosing a team of 3 from 10 people = C(10,3) = 120."},
{category:'math',difficulty:'easy',q:'What is a function in mathematics?',options:['A Python function','A mapping where each input has exactly one output','A set of equations','A formula with variables'],answer:1,explain:"Mathematical function f: A→B maps each element of domain A to exactly one element of codomain B. Each input has exactly one output. Basis of all of CS and mathematics."},
{category:'math',difficulty:'easy',q:'What is the difference between a tree and a graph?',options:['Trees are bigger','A tree is a connected acyclic graph with a root — graphs can have cycles and disconnected components','Trees have more edges','Graphs cannot be drawn'],answer:1,explain:"A tree is a special graph: connected, acyclic (no cycles), n nodes and n-1 edges. Graphs are more general — can have cycles, multiple components, any number of edges."},
{category:'math',difficulty:'easy',q:'What is the degree of a vertex in a graph?',options:['Its depth in the tree','The number of edges connected to it','Its value/weight','Its distance from root'],answer:1,explain:"Degree of a vertex: number of edges incident to it. In a directed graph: in-degree (incoming) and out-degree (outgoing). Sum of all degrees = 2 × number of edges."},
{category:'math',difficulty:'easy',q:'What is log₂(8)?',options:['2','3','4','8'],answer:1,explain:"log₂(8): 2 to what power gives 8? 2³=8. So log₂(8)=3. Logarithms are the inverse of exponentials. Critical for analyzing algorithm complexity."},
{category:'math',difficulty:'medium',q:'What is two\'s complement used for?',options:['Doubling numbers','Representing negative integers in binary — flip bits and add 1','Multiplying by 2','A type of overflow'],answer:1,explain:"Two's complement: to negate a binary number, flip all bits then add 1. Allows hardware to use the same circuit for addition and subtraction. -x = ~x + 1 in binary."},
{category:'math',difficulty:'medium',q:'What is a proof by mathematical induction?',options:['Proving by example','Prove base case P(1), then prove P(k)→P(k+1). Concludes P(n) is true for all n≥1','Testing many cases','Using deductive reasoning'],answer:1,explain:"Induction: 1) Base case: prove P(1) true. 2) Inductive step: assume P(k) true, prove P(k+1) true. Like dominoes — first falls, each falls the next."},
{category:'math',difficulty:'medium',q:'What is a recurrence relation?',options:['A mathematical formula','An equation defining a sequence in terms of previous terms — e.g. T(n) = 2T(n/2) + n','A repeated function call','A recursive data structure'],answer:1,explain:"Recurrence relation: defines a sequence where each term depends on previous terms. Used to express algorithm runtime. T(n) = 2T(n/2) + n describes merge sort."},
{category:'math',difficulty:'medium',q:'What does the Master Theorem solve?',options:['All math problems','Recurrences of the form T(n) = aT(n/b) + f(n) — gives O() directly','Sorting algorithms','Graph problems'],answer:1,explain:"Master Theorem: for T(n) = aT(n/b) + f(n), compare f(n) with n^(log_b a). Three cases give O(n^log_b a), O(n^log_b a × log n), or O(f(n)). Quickly analyzes divide-and-conquer."},
{category:'math',difficulty:'medium',q:'What is the Pigeonhole Principle?',options:['About pigeons','If n+1 items are placed in n containers, at least one container has ≥2 items','A sorting principle','A graph theorem'],answer:1,explain:"Pigeonhole: n+1 pigeons in n holes → at least one hole has ≥2 pigeons. Used to prove existence of duplicates, hash collisions, birthday problem (~23 people for 50% chance of same birthday)."},
{category:'math',difficulty:'medium',q:'What is propositional logic?',options:['Logic about proposals','Formal system for reasoning with statements that are true or false using connectives (AND, OR, NOT, →)','Statistics','Logic about numbers'],answer:1,explain:"Propositional logic: formal language with propositions (true/false), connectives (∧,∨,¬,→,↔). Basis for boolean algebra, circuit design, program verification."},
{category:'math',difficulty:'medium',q:'What does p → q (implication) mean?',options:['p equals q','If p then q — false only when p is true and q is false','p OR q','p AND q'],answer:1,explain:"p→q: if p then q. Truth table: T→T=T, T→F=F, F→T=T, F→F=T. False only when premise is true but conclusion is false. This is often counterintuitive (false premise→anything is true)."},
{category:'math',difficulty:'medium',q:'What is a bijection (bijective function)?',options:['A one-way function','A function that is both injective (one-to-one) and surjective (onto) — every element in codomain has exactly one preimage','A function with no inverse','A function from X to X'],answer:1,explain:"Bijection: every output has exactly one input. Has an inverse. Used to prove two sets have the same cardinality. e.g. f(x)=2x maps ℤ bijectively to even integers."},
{category:'math',difficulty:'medium',q:'What is the inclusion-exclusion principle?',options:['Adding and subtracting sets','|A∪B| = |A| + |B| - |A∩B| — used to avoid double-counting','A type of proof','A sorting method'],answer:1,explain:"Inclusion-exclusion: |A∪B| = |A|+|B|-|A∩B|. Extended: |A∪B∪C| = |A|+|B|+|C|-|A∩B|-|A∩C|-|B∩C|+|A∩B∩C|. Avoids double-counting overlapping sets."},
{category:'math',difficulty:'medium',q:'What is graph coloring?',options:['Painting graphs','Assigning colors to vertices so adjacent vertices have different colors — minimum colors needed is chromatic number','Coloring edges','A type of traversal'],answer:1,explain:"Graph coloring: assign colors to vertices such that no two adjacent vertices share a color. Chromatic number χ(G) = minimum colors needed. 4-color theorem: planar maps need ≤4 colors."},
{category:'math',difficulty:'medium',q:'What is an Euler path?',options:['A shortest path','A path traversing every EDGE exactly once','A path visiting every vertex once','A path in a directed graph'],answer:1,explain:"Euler path: traverses every edge exactly once. Exists iff graph has exactly 0 or 2 vertices with odd degree. (0 odd vertices = Euler circuit, starts and ends same vertex)."},
{category:'math',difficulty:'medium',q:'What is a spanning tree of a graph?',options:['A tree inside a graph','A subgraph that is a tree and includes all vertices — minimum edges to keep graph connected','The largest subtree','A tree with all possible edges'],answer:1,explain:"Spanning tree: subgraph including all vertices with exactly n-1 edges forming a tree. A graph with n vertices can have many spanning trees. Minimum spanning tree minimizes total edge weight."},
{category:'math',difficulty:'medium',q:'What is a matrix (in linear algebra)?',options:['A database','A rectangular array of numbers arranged in rows and columns','A 2D list in Python','A set of equations'],answer:1,explain:"Matrix: m×n grid of numbers. Used to represent linear transformations, systems of equations, graphs (adjacency matrix), image data. Matrix multiplication is fundamental to ML and graphics."},
{category:'math',difficulty:'medium',q:'What is the determinant of a 2×2 matrix [[a,b],[c,d]]?',options:['a+d','ad+bc','ad-bc','ab-cd'],answer:2,explain:"det([[a,b],[c,d]]) = ad - bc. If det≠0, matrix is invertible. det=0 means the transformation squashes space to lower dimension (no inverse)."},
{category:'math',difficulty:'medium',q:'What is an eigenvalue?',options:['A special variable name','A scalar λ such that Av = λv for some nonzero vector v (eigenvector) — the matrix only scales this vector','A matrix property','A type of solution'],answer:1,explain:"Eigenvalue λ: Av = λv means matrix A only scales eigenvector v by factor λ without changing its direction. Central to PCA, Google PageRank, quantum mechanics, differential equations."},
{category:'math',difficulty:'medium',q:'What is linear independence of vectors?',options:['Vectors that are perpendicular','A set where no vector can be written as a linear combination of the others','Vectors with same length','Vectors in the same direction'],answer:1,explain:"Linear independence: {v₁,...,vₙ} are independent if c₁v₁+...+cₙvₙ=0 implies all cᵢ=0. Dependent: one vector is a combination of others (redundant). Basis = maximal independent set."},
{category:'math',difficulty:'medium',q:'What is a Hamiltonian path?',options:['A path named after Hamilton','A path visiting every VERTEX exactly once (vs Euler path: every edge)','A shortest path','A path in a weighted graph'],answer:1,explain:"Hamiltonian path visits every vertex exactly once. Finding it is NP-complete (unlike Euler path which is polynomial). Hamiltonian cycle: starts and ends at same vertex."},
{category:'math',difficulty:'medium',q:'What is the birthday paradox?',options:['A party trick','In a group of ~23 people, probability of two sharing a birthday exceeds 50% — counterintuitive due to combinatorial explosion','A calendar problem','A probability impossibility'],answer:1,explain:"Birthday paradox: 23 people → >50% chance two share a birthday. 70 people → >99.9%. Counterintuitive because we compare all pairs, not just one person. Relevant to hash collisions."},
{category:'math',difficulty:'hard',q:'What is a formal language?',options:['A programming language with formal grammar','A set of strings over an alphabet — characterized by a grammar or automaton','A type of proof','A natural language formalized'],answer:1,explain:"Formal language: set of strings over an alphabet Σ. Described by grammars (Chomsky hierarchy) or automata. Regular languages ↔ finite automata. Context-free ↔ pushdown automata."},
{category:'math',difficulty:'hard',q:'What is the Halting Problem?',options:['A problem that halts execution','The undecidable problem: no algorithm can determine for all (program, input) pairs whether the program will halt','A type of infinite loop detection','An NP-complete problem'],answer:1,explain:"Halting problem: decide if program P halts on input I. Alan Turing proved (1936) this is UNDECIDABLE — no program can solve it in general. Proved by contradiction using self-reference."},
{category:'math',difficulty:'hard',q:'What is a context-free grammar?',options:['A grammar without rules','A formal grammar where production rules are of form A→α (single non-terminal on left) — generates context-free languages','A regular grammar','A grammar for natural languages'],answer:1,explain:"CFG: rules of form A→α where A is a non-terminal. Generates context-free languages (includes programming language syntax). Parsed by pushdown automata. More powerful than regular grammars."},
{category:'math',difficulty:'hard',q:'What is Shannon entropy?',options:['A measure of disorder in physics','A measure of information content/uncertainty: H = -Σ p(x) log₂ p(x)','A type of encryption','A sorting measure'],answer:1,explain:"Shannon entropy H measures average information content. H=0 for certain events, maximum for uniform distribution. Foundation of information theory, data compression, and machine learning."},
{category:'math',difficulty:'hard',q:'What is the Chinese Remainder Theorem?',options:['A theorem about Chinese math','Given pairwise coprime moduli, there is a unique solution (mod m₁×m₂×...×mₙ) to systems of simultaneous congruences','A sorting theorem','A prime number theorem'],answer:1,explain:"CRT: system x≡a₁(mod m₁), x≡a₂(mod m₂)... has unique solution mod(m₁×m₂×...) when moduli are pairwise coprime. Used in cryptography, parallel computing."},
{category:'math',difficulty:'hard',q:'What are complexity classes P and NP?',options:['Types of algorithms','P = decidable in polynomial time. NP = verifiable in polynomial time. P⊆NP. Whether P=NP is unknown.','P = parallel, NP = not parallel','Notations for runtime'],answer:1,explain:"P: problems solvable in poly time. NP: solutions verifiable in poly time. All P problems are in NP. NP-hard: at least as hard as any NP problem. P=NP? Greatest unsolved problem in CS."},
{category:'math',difficulty:'hard',q:'What is Fermat\'s Little Theorem used for in CS?',options:['Number theory curiosity','If p is prime and gcd(a,p)=1, then a^(p-1) ≡ 1 (mod p) — used in primality testing and RSA','Sorting integers','Graph algorithms'],answer:1,explain:"Fermat's Little: a^(p-1)≡1(mod p) for prime p, gcd(a,p)=1. Used in: Miller-Rabin primality test, modular inverse (a^(p-2) mod p), RSA decryption. Foundation of number-theoretic cryptography."},
{category:'math',difficulty:'hard',q:'What is a regular expression in formal language theory?',options:['Pattern matching syntax in Python','A formal description of a regular language using concatenation, union, and Kleene star','A type of grammar','A search algorithm'],answer:1,explain:"Formal RegEx: operations on languages: concatenation (AB), union (A|B), Kleene star (A*=zero or more). Describes exactly the regular languages (equivalent to DFA/NFA). Programming regex extends this."},
{category:'math',difficulty:'hard',q:'What is the Pumping Lemma?',options:['A lemma about pumps','A theorem for proving languages are NOT regular — a regular language must have repeatable patterns','A proof technique','A type of induction'],answer:1,explain:"Pumping Lemma: every regular language L has pumping length p. Every string s in L with |s|≥p can be split into xyz where y can be repeated any number of times and stay in L. Used to prove non-regularity."},
{category:'math',difficulty:'hard',q:'What is RSA encryption based on?',options:['Symmetric keys','The difficulty of factoring the product of two large primes — modular exponentiation','Hashing algorithms','Symmetric encryption'],answer:1,explain:"RSA: public key = n=p×q (two large primes) and e. Private key = d (modular inverse of e mod (p-1)(q-1)). Encryption: m^e mod n. Decryption: c^d mod n. Security relies on factoring being hard."},
{category:'db',difficulty:'easy',q:'What does SELECT * FROM users do?',options:['Deletes users','Returns all rows and all columns from the users table','Creates a users table','Updates users'],answer:1,explain:"SELECT * returns all columns (*=wildcard). FROM specifies the table. This retrieves every row and column from users."},
{category:'db',difficulty:'easy',q:'What does WHERE do in SQL?',options:['Groups results','Filters rows based on a condition','Sorts results','Joins tables'],answer:1,explain:"WHERE filters rows: SELECT * FROM users WHERE age > 18 only returns users with age > 18. Applied BEFORE GROUP BY."},
{category:'db',difficulty:'easy',q:'What does ORDER BY name DESC do?',options:['Creates an index','Sorts results by name in descending (Z-A) order','Filters by name','Groups by name'],answer:1,explain:"ORDER BY sorts the result. DESC = descending (Z-A, 9-0). ASC = ascending (default). Can sort by multiple columns: ORDER BY age DESC, name ASC."},
{category:'db',difficulty:'easy',q:'What is a primary key?',options:['The most important column','A column (or set) that uniquely identifies each row and cannot be NULL','The first column','A sorted index'],answer:1,explain:"Primary key: unique identifier for each row. Cannot be NULL. Each table should have one. Usually an auto-incrementing ID. Enforces entity integrity."},
{category:'db',difficulty:'easy',q:'What is a foreign key?',options:['A key from another country','A column referencing the primary key of another table — enforces referential integrity','A secondary index','A backup key'],answer:1,explain:"Foreign key: column in table B referencing primary key of table A. Ensures referenced rows exist (referential integrity). e.g. orders.user_id references users.id."},
{category:'db',difficulty:'easy',q:'What does COUNT(*) return?',options:['Size of table in bytes','Number of rows in the result','Number of columns','Number of non-NULL values'],answer:1,explain:"COUNT(*) counts all rows including those with NULLs. COUNT(column) counts non-NULL values in that column."},
{category:'db',difficulty:'easy',q:'What does GROUP BY do?',options:['Sorts results','Groups rows with the same value into summary rows — used with aggregate functions','Filters groups','Joins tables'],answer:1,explain:"GROUP BY groups rows by column values. Used with aggregates: SELECT dept, COUNT(*) FROM employees GROUP BY dept counts employees per department."},
{category:'db',difficulty:'easy',q:'What does DISTINCT do?',options:['Selects primary key','Returns only unique values, removing duplicates','Selects fastest rows','Creates unique index'],answer:1,explain:"SELECT DISTINCT removes duplicate rows from results. SELECT DISTINCT city FROM users returns each city only once."},
{category:'db',difficulty:'easy',q:'What is NULL in SQL?',options:['Zero','Empty string','Unknown or missing value — not equal to anything, including NULL','A placeholder'],answer:2,explain:"NULL represents missing/unknown value. NULL != NULL in SQL (use IS NULL / IS NOT NULL to check). NULL in arithmetic gives NULL. NULLs are tricky — many bugs come from NULL handling."},
{category:'db',difficulty:'easy',q:'What does INSERT INTO users VALUES (1, "Alice") do?',options:['Updates Alice','Adds a new row to the users table','Creates users table','Selects Alice'],answer:1,explain:"INSERT INTO adds new rows to a table. Specify table and values in the order of columns, or use INSERT INTO users (id, name) VALUES (1, 'Alice') to be explicit."},
{category:'db',difficulty:'easy',q:'What does UPDATE users SET name="Bob" WHERE id=1 do?',options:['Inserts Bob','Changes name to Bob for the row where id=1','Deletes id=1','Creates a user'],answer:1,explain:"UPDATE modifies existing rows. SET specifies what to change. WHERE filters which rows. Without WHERE — ALL rows are updated! Always include WHERE in UPDATE."},
{category:'db',difficulty:'easy',q:'What does DELETE FROM users WHERE id=5 do?',options:['Hides user 5','Permanently removes the row where id=5 from users','Marks user as deleted','Updates user 5'],answer:1,explain:"DELETE removes rows permanently. WHERE specifies which rows. Without WHERE — DELETES ALL ROWS. Always double-check WHERE before deleting."},
{category:'db',difficulty:'easy',q:'What is a JOIN?',options:['Combining columns of one table','Combining rows from two or more tables based on a related column','Adding new columns','Sorting two tables'],answer:1,explain:"JOIN combines rows from two tables based on a condition. SELECT u.name, o.amount FROM users u JOIN orders o ON u.id = o.user_id links users with their orders."},
{category:'db',difficulty:'easy',q:'What is the difference between INNER JOIN and LEFT JOIN?',options:['None','INNER JOIN: only matching rows. LEFT JOIN: all rows from left table, matching from right (NULL if no match)','LEFT JOIN is faster','INNER JOIN includes NULLs'],answer:1,explain:"INNER JOIN: only rows with matches in both tables. LEFT JOIN: all rows from left table; NULLs for right columns where no match exists. Use LEFT JOIN to include unmatched rows."},
{category:'db',difficulty:'easy',q:'What does SUM(salary) do?',options:['Counts salary rows','Adds all salary values','Finds max salary','Averages salaries'],answer:1,explain:"SUM() is an aggregate function that adds all non-NULL values. SELECT SUM(salary) FROM employees gives total payroll. Used with GROUP BY for totals per group."},
{category:'db',difficulty:'medium',q:'What is the difference between WHERE and HAVING?',options:['None','WHERE filters rows before grouping; HAVING filters groups after GROUP BY','HAVING is faster','WHERE works with aggregates'],answer:1,explain:"WHERE: filters individual rows before aggregation. HAVING: filters groups after GROUP BY. Use HAVING for conditions on aggregates: HAVING COUNT(*) > 5."},
{category:'db',difficulty:'medium',q:'What is database normalization?',options:['Speeding up queries','Organizing data to reduce redundancy and dependency — 1NF, 2NF, 3NF, BCNF','Making column names normal','Sorting tables'],answer:1,explain:"Normalization: organize database to minimize redundancy. 1NF: atomic values, no repeating groups. 2NF: no partial dependencies. 3NF: no transitive dependencies. Reduces anomalies in insert/update/delete."},
{category:'db',difficulty:'medium',q:'What is 1NF (First Normal Form)?',options:['First database created','Each column contains atomic (indivisible) values; no repeating groups; each row is unique','Having a primary key','Having only one table'],answer:1,explain:"1NF: 1) Atomic values (no lists in a cell). 2) No repeating column groups. 3) Each row uniquely identifiable. Violates 1NF: storing 'Alice,Bob' in one cell."},
{category:'db',difficulty:'medium',q:'What is a database transaction?',options:['A database fee','A unit of work that is atomic — either all operations succeed or none do (ACID properties)','A type of query','A join operation'],answer:1,explain:"Transaction: sequence of operations treated as one unit. Either all succeed (commit) or all fail (rollback). e.g. bank transfer: debit + credit must both succeed or neither happens."},
{category:'db',difficulty:'medium',q:'What does ACID stand for?',options:['Atomicity, Consistency, Isolation, Durability','Accuracy, Consistency, Integration, Distribution','Atomicity, Completeness, Isolation, Data','Append, Create, Insert, Delete'],answer:0,explain:"ACID: Atomicity (all or nothing), Consistency (valid state before and after), Isolation (concurrent transactions don't interfere), Durability (committed data persists despite failures)."},
{category:'db',difficulty:'medium',q:'What is a database index?',options:['A table of contents','A data structure that speeds up queries at the cost of storage and slower writes','A sorted table','A primary key'],answer:1,explain:"Index: separate data structure (usually B+ tree) storing sorted column values with pointers to rows. Dramatically speeds up queries on indexed columns. Costs: extra storage, slower INSERT/UPDATE/DELETE."},
{category:'db',difficulty:'medium',q:'What is a subquery?',options:['A small query','A query nested inside another query — used to filter, compare, or provide values','A type of join','A query on a subset of data'],answer:1,explain:"Subquery: nested SELECT. e.g. SELECT * FROM users WHERE id IN (SELECT user_id FROM orders WHERE amount > 100). Can appear in WHERE, FROM, SELECT clauses."},
{category:'db',difficulty:'medium',q:'What is a view in SQL?',options:['A way to visualize data','A named virtual table defined by a SELECT query — queried like a regular table but data is computed on access','A materialized table','A type of index'],answer:1,explain:"View: virtual table defined by a stored query. SELECT * FROM my_view runs the underlying query. Simplifies complex queries, provides abstraction, can control what users see."},
