{category:'db',difficulty:'medium',q:'What is a deadlock in databases?',options:['A slow query','Two transactions each waiting for the other to release a lock — neither can proceed','A timeout','A broken connection'],answer:1,explain:"Deadlock: T1 holds lock A, wants B. T2 holds B, wants A. Neither can proceed. Databases detect and resolve by rolling back one transaction. Prevention: consistent lock ordering."},
{category:'db',difficulty:'medium',q:'What is an EXISTS subquery vs IN?',options:['They are identical','EXISTS: checks if subquery returns any rows (stops early when found). IN: checks if value is in result set (retrieves all)','IN is always faster','EXISTS only works for primary keys'],answer:1,explain:"EXISTS stops as soon as it finds a match — efficient for large subqueries. IN retrieves all matching values. EXISTS is often faster when the subquery result is large."},
{category:'db',difficulty:'medium',q:'What is 2NF (Second Normal Form)?',options:['Second table created','Must be in 1NF AND no partial dependencies — every non-key column depends on the WHOLE primary key','Having two foreign keys','Two primary keys'],answer:1,explain:"2NF: 1NF + no partial dependencies. A column shouldn't depend on only part of a composite primary key. e.g. if PK=(StudentID, CourseID), student name shouldn't be in this table — it depends only on StudentID."},
{category:'db',difficulty:'medium',q:'What is 3NF (Third Normal Form)?',options:['Third table created','Must be in 2NF AND no transitive dependencies — non-key columns depend only on the primary key, not on other non-key columns','Having three tables','Three normal forms combined'],answer:1,explain:"3NF: 2NF + no transitive dependencies. e.g. if table has (EmployeeID, DeptID, DeptName): DeptName depends on DeptID (not EmployeeID) — transitive dependency. Solution: separate Departments table."},
{category:'db',difficulty:'medium',q:'What is a stored procedure?',options:['A stored file','A precompiled SQL code block stored in the database and executed by name','A type of view','A backup procedure'],answer:1,explain:"Stored procedure: named, precompiled SQL stored in DB. Called with EXEC proc_name. Reduces network traffic, allows code reuse, can use variables and logic. Supported by MySQL, PostgreSQL, SQL Server."},
{category:'db',difficulty:'hard',q:'What is query optimization?',options:['Writing shorter queries','The database engine\'s process of choosing the most efficient execution plan for a query','Caching queries','Indexing all columns'],answer:1,explain:"Query optimizer: analyzes possible execution plans (join order, index usage, scan methods) and selects the cheapest one based on statistics. Use EXPLAIN to see the plan chosen."},
{category:'db',difficulty:'hard',q:'What is a B+ tree index vs B-tree?',options:['Same thing','B+tree: all data in leaves linked as list (better range queries). B-tree: data in all nodes. B+ preferred for databases.','B-tree is newer','B+ uses less memory'],answer:1,explain:"B+tree: internal nodes only store keys for routing; all data in leaf nodes which form a linked list. Better for range queries (scan leaf chain). B-tree stores data at all levels. Databases use B+."},
{category:'db',difficulty:'hard',q:'What is MVCC (Multi-Version Concurrency Control)?',options:['Multiple database versions','Allows multiple transactions to see consistent snapshots by keeping multiple versions of rows — readers don\'t block writers','Multiple copies of data','A replication strategy'],answer:1,explain:"MVCC: each transaction sees a snapshot of data from when it started. Writes create new versions; old versions kept until no transaction needs them. Readers never block writers. Used by PostgreSQL, MySQL InnoDB."},
{category:'db',difficulty:'hard',q:'What is the CAP theorem?',options:['Create, Access, Persist','A distributed system can guarantee at most 2 of 3: Consistency, Availability, Partition tolerance','CPU, Availability, Performance','A caching theorem'],answer:1,explain:"CAP: in a distributed system, during network partition you must choose between Consistency (all nodes see same data) and Availability (every request gets a response). Partition tolerance is required."},
{category:'db',difficulty:'hard',q:'What is database sharding?',options:['Deleting old data','Horizontally partitioning data across multiple databases — each shard holds a subset of data','Splitting a table into views','A backup strategy'],answer:1,explain:"Sharding: distribute data across multiple DB instances (shards). e.g. users with id 1-1M in shard 1, 1M-2M in shard 2. Enables horizontal scaling but complicates queries spanning shards."},
{category:'db',difficulty:'hard',q:'What is Write-Ahead Logging (WAL)?',options:['Logging writes after commit','Changes are written to a log BEFORE being applied to the database — enables crash recovery and replication','A type of transaction','A backup method'],answer:1,explain:"WAL: all changes logged before applied to main storage. On crash, replay log from last checkpoint to recover. Also used for replication — send WAL to replicas. Used by PostgreSQL."},
{category:'db',difficulty:'hard',q:'What is eventual consistency?',options:['Data is always consistent','In distributed systems, replicas will eventually converge to the same value if no new updates — but may be inconsistent temporarily','Updates are slow','A weak transaction guarantee'],answer:1,explain:"Eventual consistency: no guarantee of immediate consistency across nodes, but given no new updates, all replicas will eventually converge. Used by DynamoDB, Cassandra. Trades consistency for availability."},
{category:'db',difficulty:'hard',q:'What is connection pooling in databases?',options:['Connecting multiple databases','Maintaining a pool of reusable database connections to avoid the overhead of creating new connections for each query','A type of indexing','A caching strategy'],answer:1,explain:"Connection pooling: maintain a pool of open DB connections shared across requests. Creating connections is expensive (TCP handshake, auth). Pool reuses existing connections. Crucial for web applications."},
{category:'db',difficulty:'hard',q:'What is the N+1 query problem?',options:['Querying N+1 tables','Fetching 1 list then making N separate queries for related data — solved by JOIN or eager loading','Having N+1 indexes','A JOIN performance issue'],answer:1,explain:"N+1: fetch 1 list of N users, then loop making N separate queries to get orders per user = N+1 total queries. Solution: JOIN in one query or use ORM's eager loading. Major performance killer."},
{category:'db',difficulty:'hard',q:'What is a materialized view?',options:['A view with colors','A view whose query results are physically stored and periodically refreshed — faster to query but data may be stale','A view with indexes','An always-up-to-date view'],answer:1,explain:"Materialized view: unlike regular views (computed on access), materialized views store results physically. Much faster to query. Must be refreshed (manually or scheduled) when base data changes."},
{category:'systems',difficulty:'easy',q:'What is RAM?',options:['Read-Access Memory','Random Access Memory — fast, volatile storage holding data for running programs','Rapid Application Memory','Real-time Access Module'],answer:1,explain:"RAM (Random Access Memory): fast, volatile (loses data on power off) memory. Holds running programs and their data. Accessed in nanoseconds. Much faster than SSD/HDD."},
{category:'systems',difficulty:'easy',q:'What is the difference between RAM and storage (SSD/HDD)?',options:['No difference','RAM: fast, volatile, temporary. Storage: slow, persistent, permanent. Programs load from storage into RAM to run.','RAM is larger','Storage is faster'],answer:1,explain:"RAM: volatile, fast (ns), temporary workspace. Storage (SSD/HDD): persistent, slower (μs-ms), permanent home. When you open a program, OS loads it from storage into RAM."},
{category:'systems',difficulty:'easy',q:'What is a process?',options:['A function running','An instance of a program in execution — has its own memory space, resources, and state','A type of thread','A running script'],answer:1,explain:"Process: program in execution. Has own virtual memory space, file handles, registers. Isolated from other processes. OS manages process scheduling, creation, termination."},
{category:'systems',difficulty:'easy',q:'What is a thread?',options:['A network connection','The smallest unit of execution within a process — shares memory with other threads in same process','A type of process','A CPU core'],answer:1,explain:"Thread: lightweight unit of execution within a process. Threads SHARE the process's memory (heap, globals) but have own stack and registers. Faster to create than processes but need synchronization."},
{category:'systems',difficulty:'easy',q:'What does an operating system do?',options:['Only runs programs','Manages hardware resources (CPU, memory, I/O), provides abstractions (processes, files), and enables multiple programs to run concurrently','Only manages files','Provides a GUI'],answer:1,explain:"OS: manages CPU (scheduling), memory (allocation), storage (file system), I/O devices, and security. Provides APIs so programs don't need to know hardware details. Examples: Linux, Windows, macOS."},
{category:'systems',difficulty:'easy',q:'What is a file system?',options:['A system of files on disk','The OS component organizing files and directories on storage — handles naming, permissions, and disk layout','A database of files','A network protocol'],answer:1,explain:"File system: organizes data on storage into files and directories. Handles: naming, hierarchical organization, permissions, metadata (size, dates), and efficient disk space management. Examples: NTFS, ext4, APFS."},
{category:'systems',difficulty:'easy',q:'What is the CPU?',options:['The power supply','Central Processing Unit — executes instructions, performing arithmetic, logic, and control operations','The cooling system','The graphics processor'],answer:1,explain:"CPU: brain of the computer. Executes instructions one (or more) at a time. Has ALU (arithmetic/logic), control unit, registers, and cache. Speed measured in GHz (billions of cycles per second)."},
{category:'systems',difficulty:'easy',q:'What is cache memory?',options:['Browser cache','Very fast, small memory close to CPU that stores frequently accessed data to reduce RAM access time','A backup of RAM','A type of storage'],answer:1,explain:"CPU cache (L1/L2/L3): extremely fast (1-40 cycles) memory on/near CPU. Stores recently/frequently used data. Much faster than RAM (100+ cycles). Cache miss = must fetch from RAM."},
{category:'systems',difficulty:'easy',q:'What is virtual memory?',options:['Fake RAM','OS technique allowing programs to use more memory than physically available by using storage as overflow','A type of cache','Memory on the GPU'],answer:1,explain:"Virtual memory: OS gives each process its own virtual address space larger than physical RAM. Pages not in RAM are stored on disk (swap). When needed, OS pages them in. Slower when swapping occurs."},
{category:'systems',difficulty:'easy',q:'What is an interrupt?',options:['Stopping a program','A signal to the CPU that an event needs immediate attention — CPU pauses current task, handles interrupt, then resumes','A type of error','A hardware failure'],answer:1,explain:"Interrupt: signal (from hardware or software) telling CPU to stop current task and handle something. e.g. keyboard press, timer, I/O completion. CPU saves state, runs interrupt handler, resumes."},
{category:'systems',difficulty:'easy',q:'What is the difference between 32-bit and 64-bit?',options:['Speed difference','The width of CPU registers and memory addressing — 64-bit can address 2⁶⁴ bytes vs 2³²','Graphics quality','Storage capacity'],answer:1,explain:"64-bit: registers and pointers are 64 bits wide. Can address 2⁶⁴ bytes (16 exabytes) of memory vs 2³² (4 GB) for 32-bit. Modern systems are 64-bit. 64-bit programs can use much more RAM."},
{category:'systems',difficulty:'easy',q:'What is a kernel?',options:['The center of a nut','The core of the OS — manages hardware resources, runs in privileged mode, provides system calls to user programs','A type of process','A CPU component'],answer:1,explain:"Kernel: core OS component with full hardware access (privileged/kernel mode). Manages CPU scheduling, memory, devices. User programs run in user mode and access hardware only through system calls."},
{category:'systems',difficulty:'easy',q:'What is a system call?',options:['A phone call to tech support','The interface for user programs to request OS services (file I/O, network, process creation)','A function call in C','A hardware interrupt'],answer:1,explain:"System call: user program requests service from OS kernel. e.g. open(), read(), write(), fork(), socket(). Transitions from user mode to kernel mode. Necessary for accessing hardware."},
{category:'systems',difficulty:'easy',q:'What is the memory hierarchy from fastest to slowest?',options:['RAM, Cache, SSD, HDD','Registers, Cache, RAM, SSD, HDD','Cache, RAM, Registers, SSD','SSD, RAM, Cache, Register'],answer:1,explain:"Registers (1 cycle) → L1 Cache (4 cycles) → L2 Cache (12 cycles) → L3 Cache (40 cycles) → RAM (100 cycles) → SSD (10k cycles) → HDD (1M cycles). Faster = smaller and more expensive."},
{category:'systems',difficulty:'easy',q:'What is paging in OS memory management?',options:['Printing pages','Dividing memory into fixed-size pages — maps virtual pages to physical frames — enables virtual memory','Loading pages from disk','A file system technique'],answer:1,explain:"Paging: virtual memory divided into fixed-size pages (typically 4KB). Physical memory divided into frames. OS maintains page table mapping virtual→physical addresses. Allows non-contiguous allocation."},
{category:'systems',difficulty:'medium',q:'What are process states?',options:['Running or stopped','New, Ready, Running, Waiting/Blocked, Terminated — transitions managed by OS scheduler','Active or inactive','Starting or stopping'],answer:1,explain:"Process states: New (created), Ready (waiting for CPU), Running (executing), Blocked/Waiting (waiting for I/O/event), Terminated (finished). OS scheduler decides which Ready process gets CPU."},
{category:'systems',difficulty:'medium',q:'What is context switching?',options:['Changing the app context','Saving CPU state of current process and loading state of next — enables multitasking but has overhead','Switching user sessions','Changing priority'],answer:1,explain:"Context switch: save registers, PC, and state of current process → load saved state of next process. Enables multitasking. Cost: time to save/restore state, cache invalidation. Hundreds of microseconds."},
{category:'systems',difficulty:'medium',q:'What is the difference between a mutex and a semaphore?',options:['Same thing','Mutex: binary lock for mutual exclusion, owned by one thread. Semaphore: counter for controlling access to N resources.','Semaphore is for processes only','Mutex can count beyond 1'],answer:1,explain:"Mutex: binary lock, owned by the thread that locked it. Only that thread can unlock. Semaphore: counter (0 to N). Signal increments, wait decrements. Can be signaled by different thread than waiter."},
{category:'systems',difficulty:'medium',q:'What is a race condition?',options:['CPU competition','Two threads accessing shared data concurrently with at least one writing — result depends on execution order','A scheduling bug','A memory leak'],answer:1,explain:"Race condition: outcome depends on the non-deterministic order of thread execution. Multiple threads read-modify-write shared data without synchronization → inconsistent results. Fixed with mutexes/locks."},
{category:'systems',difficulty:'medium',q:'What is deadlock in OS?',options:['System crash','Two or more processes waiting for each other to release resources — all blocked forever without intervention','A slow process','A scheduling issue'],answer:1,explain:"Deadlock conditions (Coffman): 1)Mutual exclusion 2)Hold and wait 3)No preemption 4)Circular wait. Prevention: break any condition. Detection: resource allocation graph. Recovery: kill a process."},
{category:'systems',difficulty:'medium',q:'What is thrashing in OS?',options:['CPU overheating','OS spends more time swapping pages in/out of disk than executing actual program code — severe performance degradation','Disk fragmentation','A type of deadlock'],answer:1,explain:"Thrashing: working set > available RAM → constant page faults → OS constantly swapping → little actual work done. Solution: reduce degree of multiprogramming, add RAM, working set model."},
{category:'systems',difficulty:'medium',q:'What is Round Robin CPU scheduling?',options:['Random CPU assignment','Each process gets a fixed time quantum in turn — preemptive, fair, and simple','First-come first-served','Priority scheduling'],answer:1,explain:"Round Robin: each process runs for time quantum q (e.g. 10ms), then preempted and put at back of ready queue. Fair to all processes. High q → like FCFS. Low q → many context switches. Good for time-sharing."},
{category:'systems',difficulty:'medium',q:'What is a pipe in OS?',options:['A type of network cable','A unidirectional data channel connecting the output of one process to input of another','A type of file','An IPC mechanism for threads'],answer:1,explain:"Pipe: unidirectional IPC. Shell: ls | grep .py — output of ls becomes input of grep. Named pipes (FIFOs) allow unrelated processes to communicate. Implemented as circular buffer in kernel."},
{category:'systems',difficulty:'medium',q:'What is a page fault?',options:['A damaged page','The CPU tries to access a virtual memory page not currently in RAM — OS must load it from disk (swap)','A file system error','A type of exception'],answer:1,explain:"Page fault: accessing a virtual page not in physical RAM. OS handles: checks if valid address, finds page on disk, loads it into a free frame, updates page table, restarts instruction. Expensive (~ms)."},
{category:'systems',difficulty:'medium',q:'What is the Translation Lookaside Buffer (TLB)?',options:['A type of RAM','A cache for page table entries — avoids looking up page table in RAM for every memory access','A disk cache','A CPU register'],answer:1,explain:"TLB: small, fast cache storing recent virtual→physical page mappings. TLB hit: O(1) address translation. TLB miss: walk page table (expensive). Context switch: flush TLB or use ASID tags."},
{category:'systems',difficulty:'medium',q:'What is FCFS (First Come First Served) scheduling?',options:['Fastest job first','Processes are scheduled in arrival order — simple but can suffer from convoy effect','Random scheduling','Priority-based'],answer:1,explain:"FCFS: simplest scheduler — queue of processes, serve in order. Non-preemptive. Convoy effect: short jobs stuck behind long ones. Average waiting time can be high. Fair but not efficient."},
{category:'systems',difficulty:'medium',q:'What is memory segmentation?',options:['Dividing disk into segments','Dividing memory into variable-size logical segments (code, stack, heap, data) with separate base and limit registers','Paging variant','A type of cache'],answer:1,explain:"Segmentation: memory divided into logical segments of variable size. Each segment has base address and limit. Allows protection (can't access other segment). Can lead to external fragmentation."},
{category:'systems',difficulty:'medium',q:'What is Copy-on-Write (CoW)?',options:['Copying before writing always','Optimization: parent and child share memory pages until one writes — then copy that page. Used in fork().','A file copy technique','A database technique'],answer:1,explain:"CoW: fork() creates child sharing parent's pages (read-only). First write to a shared page triggers copy of just that page. Efficient — only copies what's actually modified. Used in OS, databases, Git."},
{category:'systems',difficulty:'hard',q:'What is cache coherence?',options:['Cache consistency checks','Ensuring all CPU cores see a consistent view of shared memory despite having separate caches','A cache algorithm','Synchronizing cache with disk'],answer:1,explain:"Cache coherence: in multi-core systems, each core has its own L1/L2 cache. If core 1 modifies a value, core 2's cached copy must be invalidated or updated. Protocols: MESI, MOESI."},
{category:'systems',difficulty:'hard',q:'What is the MESI protocol?',options:['A database protocol','Cache coherence protocol: Modified, Exclusive, Shared, Invalid — states for each cache line in multi-core systems','A memory allocation strategy','A CPU scheduling protocol'],answer:1,explain:"MESI: each cache line is in one of 4 states. Modified (dirty, exclusive), Exclusive (clean, exclusive), Shared (multiple caches have clean copy), Invalid (stale). Transitions maintain coherence."},
{category:'systems',difficulty:'hard',q:'What is DMA (Direct Memory Access)?',options:['Direct Memory Allocation','Hardware mechanism allowing I/O devices to transfer data directly to/from RAM without CPU involvement','A type of cache','A memory bus'],answer:1,explain:"DMA: I/O controller transfers data directly to/from RAM without CPU. CPU initiates transfer, DMA controller handles it, raises interrupt when done. Frees CPU for other work during data transfer."},
{category:'systems',difficulty:'hard',q:'What is a hypervisor?',options:['A super administrator','Software (or hardware) that creates and manages virtual machines — Type 1 runs on hardware, Type 2 runs on OS','A kernel component','A type of scheduler'],answer:1,explain:"Type 1 hypervisor (bare metal): runs directly on hardware. e.g. VMware ESXi, Hyper-V. Type 2 (hosted): runs as app on OS. e.g. VirtualBox, VMware Workstation. Virtualization enables cloud computing."},
{category:'systems',difficulty:'hard',q:'What is CPU pipeline hazard?',options:['Overheating CPU','Situations preventing the next instruction from executing in the next pipeline stage: data, control, or structural hazards','A CPU bug','A scheduling problem'],answer:1,explain:"Hazards: Data (instruction needs result not yet computed), Control (branch outcome unknown, wrong instructions fetched), Structural (hardware resource conflict). Solutions: stalling, forwarding, branch prediction."},
{category:'systems',difficulty:'hard',q:'What is NUMA (Non-Uniform Memory Access)?',options:['A memory standard','Multi-processor architecture where memory access time depends on memory location relative to the processor','No Unified Memory Architecture','A type of cache'],answer:1,explain:"NUMA: in multi-socket systems, each CPU has local RAM (fast) and can access remote RAM (slower). OS/programs should allocate memory local to the CPU using it. Linux: numactl."},
{category:'systems',difficulty:'hard',q:'What is memory-mapped I/O vs port-mapped I/O?',options:['Same thing','Memory-mapped: device registers in same address space as RAM (normal load/store). Port-mapped: separate I/O address space (special in/out instructions).','Memory-mapped is faster','Port-mapped is more common'],answer:1,explain:"Memory-mapped I/O: device registers appear as memory addresses — simple load/store instructions access hardware. Port-mapped: separate I/O address space with special in/out instructions (x86). Modern CPUs prefer memory-mapped."},
{category:'systems',difficulty:'hard',q:'What is a CPU pipeline?',options:['Network pipeline','Breaking instruction execution into stages (fetch, decode, execute, memory, writeback) to overlap multiple instructions — increases throughput','A type of process','A memory bus'],answer:1,explain:"Pipeline: execute multiple instructions overlapped in stages. 5-stage: IF (fetch), ID (decode), EX (execute), MEM (memory), WB (writeback). While instruction 1 is in EX, instruction 2 is in ID, etc. Increases IPC."},
{category:'systems',difficulty:'hard',q:'What is the difference between concurrency and parallelism?',options:['Same thing','Concurrency: multiple tasks making progress (may interleave on one core). Parallelism: multiple tasks running simultaneously on multiple cores.','Parallelism is software; concurrency is hardware','Concurrency requires multiple CPUs'],answer:1,explain:"Concurrency: structuring program to handle multiple tasks (may not run simultaneously). Parallelism: actually executing simultaneously on multiple cores. Concurrent programs may run on 1 core via interleaving."},
{category:'se',difficulty:'easy',q:'What is the Software Development Life Cycle (SDLC)?',options:['A software subscription','The structured process for planning, creating, testing, and deploying software: requirements → design → implement → test → deploy → maintain','A type of agile','A project management tool'],answer:1,explain:"SDLC: framework for software development. Phases: Requirements gathering, System Design, Implementation, Testing, Deployment, Maintenance. Different models (Waterfall, Agile, Spiral) organize these differently."},
{category:'se',difficulty:'easy',q:'What is the Waterfall model?',options:['An agile method','Linear sequential phases: requirements → design → implementation → testing → deployment — each phase completes before next begins','A type of sprint','A CI/CD pipeline'],answer:1,explain:"Waterfall: rigid sequential model. Each phase must be completed and approved before next begins. Simple to manage. Poor for changing requirements — can't go back easily. Good for fixed, well-understood requirements."},
{category:'se',difficulty:'easy',q:'What is Agile development?',options:['Fast coding','Iterative, incremental approach emphasizing flexibility, collaboration, and responding to change over following a rigid plan','A programming language','A testing framework'],answer:1,explain:"Agile: iterative development in short cycles (sprints). Deliver working software frequently, adapt to change, collaborate with stakeholders. Values: Individuals, Working Software, Customer Collaboration, Responding to Change."},
{category:'se',difficulty:'easy',q:'What is a Sprint in Scrum?',options:['Running fast','A fixed time-box (usually 2 weeks) for completing a set of planned tasks — results in a potentially shippable product increment','A type of test','A planning meeting'],answer:1,explain:"Sprint: fixed iteration (1-4 weeks, usually 2). Team commits to user stories from backlog. Daily standups track progress. Sprint Review shows stakeholders. Sprint Retrospective improves process."},
{category:'se',difficulty:'easy',q:'What is a user story?',options:['A story for users to read','A short requirement description from the user\'s perspective: "As a [role], I want [feature] so that [benefit]"','A type of bug report','A design document'],answer:1,explain:"User story: concise description of a feature from user's view. Format: 'As a [user], I want [goal] so that [reason].' Helps keep focus on user value. Has acceptance criteria defining when it's done."},
{category:'se',difficulty:'easy',q:'What is a code review?',options:['Reading code for fun','A systematic examination of code by other developers before merging — finds bugs, improves quality, shares knowledge','An automated test','A performance analysis'],answer:1,explain:"Code review: before merging, other developers examine code for bugs, logic errors, security issues, style, and maintainability. Improves quality, shares knowledge, maintains standards."},
{category:'se',difficulty:'easy',q:'What is a unit test?',options:['A test for one person','A test verifying a single function/method in isolation — fast, automated, no external dependencies','A test of the whole system','A manual test'],answer:1,explain:"Unit test: tests a single unit (function/method/class) in isolation. Mock external dependencies. Should be fast (milliseconds), independent, and cover edge cases. Foundation of test pyramid."},
{category:'se',difficulty:'easy',q:'What is an integration test?',options:['Testing one function','Testing how multiple components work together — catches issues at boundaries between units','Testing the UI','Testing performance'],answer:1,explain:"Integration test: verifies that multiple components work correctly together. e.g. testing that your code correctly queries a real database. Slower than unit tests. Catches interface/contract issues."},
{category:'se',difficulty:'easy',q:'What is technical debt?',options:['Money owed for software','The cost of accumulated shortcuts and poor decisions in code — must eventually be paid with refactoring or rewrites','A type of bug','Slow performance'],answer:1,explain:"Technical debt: accumulated cost of taking shortcuts (poor design, skipped tests, copy-paste code). Like financial debt: incurs interest (slower development, more bugs). Must be paid by refactoring."},
{category:'se',difficulty:'easy',q:'What is refactoring?',options:['Rewriting from scratch','Restructuring existing code without changing its external behavior — improves readability, maintainability, and removes debt','Fixing bugs','Adding features'],answer:1,explain:"Refactoring: improve internal code structure without changing behavior. Extract functions, rename variables, remove duplication, simplify logic. Supported by tests that verify behavior doesn't change."},
{category:'se',difficulty:'easy',q:'What is a bug vs a feature?',options:['They are the same','Bug: unintended behavior deviating from spec. Feature: intentional, planned functionality.','Bugs are user mistakes','Features are bugs without reports'],answer:1,explain:"Bug: software behaves differently than specified/expected. Feature: intentional capability. Sometimes disputed: 'Is this a bug or a feature?' Usually: if it was intended → feature, unintended → bug."},
{category:'se',difficulty:'easy',q:'What is documentation in software?',options:['Legal paperwork','Written explanations of code, APIs, processes, and decisions — helps current and future developers understand the system','Comments only','A type of test'],answer:1,explain:"Documentation: written material explaining software. Types: code comments, API docs, README, architecture docs, runbooks. Good docs: reduce onboarding time, help maintenance, preserve decisions."},
{category:'se',difficulty:'easy',q:'What is a software requirement?',options:['A list of needed computers','A specification of what the system should do (functional) or how it should perform (non-functional)','A code comment','A type of test'],answer:1,explain:"Requirements: functional (what system does: 'user can log in'), non-functional (how: 'page loads in <2 seconds'). Good requirements: specific, measurable, achievable, relevant, testable."},
{category:'se',difficulty:'easy',q:'What is version control and why is it important?',options:['Controlling which version of software users see','Tracking all changes to code over time — enables collaboration, history, rollback, and branching','A deployment tool','A testing tool'],answer:1,explain:"Version control (Git): records all changes with who, what, and when. Enables collaboration (merge work), history (see how code evolved), rollback (undo mistakes), and parallel work (branches)."},
{category:'se',difficulty:'easy',q:'What is Continuous Integration (CI)?',options:['Continuously writing code','Automatically building and testing code whenever changes are pushed — catches issues early','A deployment strategy','A type of sprint'],answer:1,explain:"CI: developers frequently integrate code into shared branch. Each integration triggers automated build + tests. Catches bugs early, prevents integration hell. Tools: GitHub Actions, Jenkins, GitLab CI."},
{category:'se',difficulty:'medium',q:'What is the Single Responsibility Principle?',options:['A class should be tiny','A class should have only one reason to change — one job/responsibility','A function should have one line','A method should take one parameter'],answer:1,explain:"SRP (SOLID): a class/module should have only one responsibility — one reason to change. e.g. a UserManager shouldn't also handle email sending. Split into UserManager + EmailService."},
{category:'se',difficulty:'medium',q:'What is the Open/Closed Principle in practice?',options:['Files should be opened then closed','Design classes to be extended via inheritance/composition without modifying existing code','All code should be open source','Methods should be public'],answer:1,explain:"OCP: add new functionality by adding new code (new classes, decorators), not modifying existing working code. Protects against introducing bugs in proven code. Strategy pattern helps implement OCP."},
{category:'se',difficulty:'medium',q:'What is Test-Driven Development (TDD)?',options:['Testing after coding','Write failing test first → write minimal code to pass → refactor. Red-Green-Refactor cycle.','Testing everything manually','A type of agile'],answer:1,explain:"TDD: write test before code (Red). Write minimal code to pass test (Green). Refactor while keeping tests green. Benefits: forces good API design, ensures testability, builds regression suite naturally."},
{category:'se',difficulty:'medium',q:'What is the MVC pattern?',options:['Multiple View Controllers','Model (data/business logic) - View (UI) - Controller (handles user input, coordinates model and view)','A database pattern','A network architecture'],answer:1,explain:"MVC separates concerns: Model (data, business rules), View (display), Controller (handles input, updates model/view). Changes to one layer minimize impact on others. Used in Django, Rails, Spring."},
{category:'se',difficulty:'medium',q:'What is REST?',options:['Resting between coding sessions','Representational State Transfer — architectural style for web APIs using HTTP methods (GET, POST, PUT, DELETE) on resources','A network protocol','A database query language'],answer:1,explain:"REST: API design style using HTTP. Resources identified by URLs. HTTP methods: GET (read), POST (create), PUT/PATCH (update), DELETE (remove). Stateless — each request is self-contained."},
{category:'se',difficulty:'medium',q:'What is the difference between PUT and PATCH in REST?',options:['No difference','PUT replaces the entire resource. PATCH partially updates it.','PATCH is for deleting','PUT creates, PATCH updates'],answer:1,explain:"PUT: replace entire resource with the request body. PATCH: partial update — only the fields in request body are changed. PATCH is more efficient for small updates to large resources."},
{category:'se',difficulty:'medium',q:'What is Continuous Deployment (CD)?',options:['Deploying continuously','Every passing CI build is automatically deployed to production — no manual steps','Deploying once a month','A testing strategy'],answer:1,explain:"CD: automate deployment pipeline from code commit to production. Every green build automatically deploys. Requires high test confidence. Enables rapid iteration. Contrast with Continuous Delivery: automated up to manual approval gate."},
{category:'se',difficulty:'medium',q:'What is code coverage?',options:['How many files exist','Percentage of code lines/branches exercised by tests — higher means less untested code','How many developers touched code','Test execution time'],answer:1,explain:"Code coverage: % of production code executed during tests. Line coverage, branch coverage (if/else paths), function coverage. 80%+ is common target. High coverage ≠ good tests, but low coverage reveals blind spots."},
{category:'se',difficulty:'medium',q:'What is dependency management?',options:['Managing team dependencies','Using tools (pip, npm, Maven) to declare, install, and version external libraries your project depends on','Tracking internal dependencies','A type of refactoring'],answer:1,explain:"Dependency management: tools to declare (requirements.txt, package.json) and install external libraries. Handles version compatibility, transitive dependencies. Enables reproducible builds."},
{category:'se',difficulty:'medium',q:'What are the Scrum ceremonies?',options:['Sprint, Standup, Review','Sprint Planning, Daily Standup, Sprint Review, Sprint Retrospective','Just daily meetings','Only sprint planning'],answer:1,explain:"Scrum ceremonies: Sprint Planning (what to do), Daily Standup (15min sync: done/doing/blockers), Sprint Review (demo to stakeholders), Sprint Retrospective (improve process). Structured, time-boxed collaboration."},
{category:'se',difficulty:'medium',q:'What is a linter?',options:['A type of compiler','A static analysis tool that checks code for style, potential bugs, and convention violations without executing it','A test runner','A code formatter'],answer:1,explain:"Linter: analyzes code without executing (static analysis). Catches: undefined variables, unused imports, style violations, potential bugs. Examples: ESLint (JS), pylint/flake8 (Python), Checkstyle (Java)."},
{category:'se',difficulty:'medium',q:'What is API versioning?',options:['Tracking API code versions','Including version in API URL/header so old clients keep working when API changes','A type of authentication','API documentation'],answer:1,explain:"API versioning: allow multiple API versions simultaneously. Approaches: URL (/api/v1/, /api/v2/), header (Accept-Version: 2), query param (?version=2). Enables backward compatibility when evolving APIs."},
{category:'se',difficulty:'medium',q:'What is a microservice?',options:['A tiny computer','A small, independently deployable service with a single responsibility, communicating via APIs (usually HTTP or messaging)','A small function','A mini database'],answer:1,explain:"Microservice: independently deployable service with single responsibility. Each can use different technology, scale independently. Communicate via REST/gRPC/messaging. Trade-off: distributed system complexity."},
{category:'se',difficulty:'hard',q:'What is event-driven architecture?',options:['Using DOM events','Systems communicate through events — producers emit events, consumers react to them asynchronously via message queues','A type of callback','An async programming pattern'],answer:1,explain:"Event-driven: decoupled components communicate via events through a message broker (Kafka, RabbitMQ). Producer emits event, consumer processes asynchronously. Enables loose coupling, scalability, resilience."},
{category:'se',difficulty:'hard',q:'What is the CQRS pattern?',options:['Command Queue Resource System','Command Query Responsibility Segregation — separate models for reading and writing data','A type of REST API','A database pattern'],answer:1,explain:"CQRS: separate read (query) and write (command) models. Enables optimizing each side independently (read replicas, event sourcing). Adds complexity — use only when read/write patterns differ significantly."},
{category:'se',difficulty:'hard',q:'What are the 3 pillars of observability?',options:['Logging, Testing, Monitoring','Logs, Metrics, Traces — together provide full visibility into system behavior in production','Alerts, Dashboards, Logs','CPU, Memory, Network'],answer:1,explain:"Observability: Logs (what happened), Metrics (how much/how fast — e.g. latency p99, error rate), Traces (how a request traveled through services). Together enable understanding and debugging distributed systems."},
{category:'se',difficulty:'hard',q:'What is the 12-factor app methodology?',options:['An app with 12 features','12 best practices for building scalable, maintainable cloud-native applications — codebase, dependencies, config, etc.','A 12-step deployment','A 12-sprint project plan'],answer:1,explain:"12-factor: 1)One codebase 2)Explicit dependencies 3)Config in env vars 4)Backing services as resources 5)Strict build/release/run 6)Stateless processes 7)Port binding 8)Concurrency 9)Disposability 10)Dev/prod parity 11)Logs as streams 12)Admin processes."},
{category:'se',difficulty:'hard',q:'What is event sourcing?',options:['Finding the source of events','Storing all state changes as an immutable sequence of events instead of current state — can rebuild any past state','Event-driven programming','A logging strategy'],answer:1,explain:"Event sourcing: instead of storing current state, store all events that led to it. State = replay of events. Benefits: full audit trail, rebuild any past state, enables CQRS. Used in banking, e-commerce."},
{category:'se',difficulty:'hard',q:'What is a service mesh?',options:['A microservice diagram','Infrastructure layer for service-to-service communication handling: load balancing, service discovery, encryption, circuit breaking (e.g. Istio, Linkerd)','A network diagram','A type of database'],answer:1,explain:"Service mesh: dedicated infrastructure for inter-service communication in microservices. Sidecars (e.g. Envoy) handle: retries, circuit breaking, mTLS, observability, load balancing. Decouples network logic from business logic."},
{category:'se',difficulty:'hard',q:'What is a circuit breaker pattern?',options:['An electrical analogy','When a service fails repeatedly, stop calling it for a period — prevents cascading failures across microservices','A type of error handling','A retry pattern'],answer:1,explain:"Circuit breaker: three states: Closed (normal), Open (failing — reject calls immediately), Half-Open (test with one call). Prevents overloading a failing service and cascading failures. Hystrix, Resilience4j."},
{category:'se',difficulty:'hard',q:'What is blue-green deployment?',options:['Deploying in two colors','Maintain two identical environments (blue=live, green=new version). Route traffic to green after testing. Instant rollback by switching back to blue.','A CI/CD pipeline','A testing strategy'],answer:1,explain:"Blue-green: two production environments. Blue: current live. Green: new version being deployed. Test green, then switch load balancer to route to green. Rollback = switch back instantly. Zero downtime."},
{category:'se',difficulty:'hard',q:'What is canary deployment?',options:['Deploying for testing birds','Gradually roll out new version to small percentage of users first — monitor for errors before full rollout','A type of A/B test','A staging environment'],answer:1,explain:"Canary: send 1-5% of traffic to new version, monitor metrics. If healthy, gradually increase to 100%. Named after 'canary in a coal mine.' Reduces blast radius of bad deploys. Used by Netflix, Google."},
{category:'se',difficulty:'hard',q:'What is the CAP theorem in system design context?',options:['Create, Access, Persist','In distributed systems: Consistency, Availability, Partition tolerance — can guarantee at most 2 of 3 during network partition','A caching principle','A API design rule'],answer:1,explain:"CAP: during network partition (P), choose between C (all nodes see same data) and A (every request gets response). CP systems (HBase): sacrifice availability for consistency. AP systems (Cassandra): sacrifice consistency."},
{category:'se',difficulty:'hard',q:'What are the SOLID principles?',options:['Security, Optimization, Logic, Integrity, Design','Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, Dependency Inversion','5 software laws','Simple, Object, Linked, Integrated, Derived'],answer:1,explain:"SOLID: S=Single Responsibility, O=Open/Closed, L=Liskov Substitution (subtypes substitutable for base), I=Interface Segregation (small interfaces), D=Dependency Inversion (depend on abstractions). Foundation of good OOP design."},
{category:'python',difficulty:'medium',q:'What is the output?',code:'x = {"a":1,"b":2,"c":3}\nprint({k:v for k,v in x.items() if v > 1})',options:["{'b':2,'c':3}","{'a':1}","{'a':1,'b':2,'c':3}","Error"],answer:0,explain:"Dictionary comprehension with filter. Only items with v>1 are kept: b:2 and c:3."},
{category:'algo',difficulty:'medium',q:'What is the time complexity of merge sort?',options:['O(n)','O(n log n)','O(n²)','O(log n)'],answer:1,explain:"Merge sort: divide array in half (log n levels), merge each level in O(n). Total: O(n log n) in all cases — best, average, and worst. Space: O(n)."},
{category:'ds',difficulty:'easy',q:'What is a queue implemented with in Python\'s standard library?',options:['queue.Queue or collections.deque','list only','array module','heapq'],answer:0,explain:"Python provides queue.Queue (thread-safe) and collections.deque (efficient double-ended operations) for queue implementations. Lists can work but are O(n) for popleft."},
{category:'se',difficulty:'easy',q:'What is a README file?',options:['A file you must read','Documentation file in a project root explaining what it does, how to install, and how to use it','A license file','A config file'],answer:1,explain:"README.md: first file visitors see on GitHub. Should cover: what the project does, installation instructions, usage examples, contributing guidelines. Essential for any project."},
{category:'git',difficulty:'easy',q:'What does git stash pop do?',options:['Removes all stashes','Applies most recent stash and removes it from the stash list','Lists stashes','Creates a new stash'],answer:1,explain:"git stash pop: applies the most recent stash and removes it from the stash stack. git stash apply keeps the stash for later use."},
{category:'math',difficulty:'easy',q:'What is 2^10?',options:['100','512','1024','2048'],answer:2,explain:"2^10 = 1024. This is why 1KB = 1024 bytes (not 1000). Powers of 2 appear everywhere in CS: 256=2^8, 65536=2^16, etc."},
{category:'systems',difficulty:'easy',q:'What is an executable file?',options:['Any file','A file containing machine code or scripts that the OS can directly run','A text file with code','A compiled C file only'],answer:1,explain:"Executable: file OS can run as a program. Contains machine code (compiled binary) or starts with a shebang (#!) for interpreted scripts. On Linux: .elf, no extension. Windows: .exe."},
{category:'db',difficulty:'easy',q:'What does AVG(salary) return?',options:['Highest salary','Average of all non-NULL salary values','Total of all salaries','Number of salary rows'],answer:1,explain:"AVG() is an aggregate function returning the arithmetic mean of non-NULL values. SELECT AVG(salary) FROM employees gives the average salary."},
{category:'oop',difficulty:'medium',q:'What is method chaining?',options:['Calling methods in a list','Returning self from methods to allow sequential calls: obj.set_name("Alice").set_age(20).save()','Inheriting methods','Overloading methods'],answer:1,explain:"Method chaining: each method returns self, allowing sequential calls in one expression. Used in builder pattern, ORM query builders (Django ORM), jQuery. Makes code fluent and readable."},
{category:'python',difficulty:'easy',q:'What is the output?',code:'print("python".capitalize())',options:['PYTHON','python','Python','Error'],answer:2,explain:".capitalize() makes the first character uppercase and the rest lowercase. 'python' becomes 'Python'."},
{category:'algo',difficulty:'easy',q:'What is O(n!) complexity?',options:['Linear','Factorial — grows extremely fast; only feasible for very small n (typically n≤10-12)','Polynomial','Exponential'],answer:1,explain:"O(n!) = factorial time. 10! = 3.6M, 15! = 1.3T, 20! ≈ 2.4 quintillion. Seen in brute-force permutation problems (naive TSP). Practically unusable for n>12."},
];

let currentQuestions=[], currentIndex=0, score=0, answered=false, currentCategory='all', currentDiff='all';

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}

function filterQuestions(cat,diff){
  let q=cat==='all'?ALL_QUESTIONS:ALL_QUESTIONS.filter(x=>x.category===cat);
  if(diff!=='all') q=q.filter(x=>x.difficulty===diff);
  return q;
}

function updateCounts(){
  const cats=['all','python','oop','ds','algo','git','math','db','systems','se'];
  cats.forEach(c=>{
    const el=document.getElementById('cnt-'+c);
    if(el){const n=filterQuestions(c,currentDiff).length;el.textContent=n+' questions';}
  });
}

function setDiff(diff,btn){
  currentDiff=diff;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  updateCounts();
}

function startQuiz(category){
  currentCategory=category;
  const pool=filterQuestions(category,currentDiff);
  if(pool.length===0){alert('No questions for this combination. Try a different difficulty.');return;}
  currentQuestions=shuffle(pool).slice(0,Math.min(15,pool.length));
  currentIndex=0; score=0;
  document.getElementById('category-screen').style.display='none';
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='block';
  const labels={all:'⚡ All Topics',python:'🐍 Python',oop:'📦 OOP',ds:'🌲 Data Structures',
    algo:'⚙️ Algorithms',git:'🔀 Git',math:'🧮 CS Math',db:'🗄️ Databases',
    systems:'💻 CS Systems',se:'🏗️ Software Eng.'};
  document.getElementById('cat-label').textContent=labels[category];
  const dBadge=document.getElementById('diff-badge');
  if(currentDiff==='all'){dBadge.textContent='';dBadge.className='diff-badge';}
  else{dBadge.textContent=currentDiff;dBadge.className='diff-badge badge-'+currentDiff;}
  showQuestion();
}

function showQuestion(){
  answered=false;
  const q=currentQuestions[currentIndex];
  const total=currentQuestions.length;
  document.getElementById('q-num').textContent=`Question ${currentIndex+1} of ${total}`;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('score-label').textContent=`Score: ${score}`;
  const codeEl=document.getElementById('q-code');
  if(q.code){codeEl.textContent=q.code;codeEl.style.display='block';}
  else{codeEl.style.display='none';}
  document.getElementById('progress-fill').style.width=((currentIndex/total)*100)+'%';
  const optContainer=document.getElementById('options');
  optContainer.innerHTML='';
  q.options.forEach((opt,i)=>{
    const btn=document.createElement('button');
    btn.className='option-btn';
    btn.textContent=opt;
    btn.onclick=()=>selectAnswer(i,btn);
    optContainer.appendChild(btn);
  });
  document.getElementById('explanation').className='explanation';
  document.getElementById('next-btn').className='next-btn';
}

function selectAnswer(index,btn){
  if(answered)return;
  answered=true;
  const q=currentQuestions[currentIndex];
  const allBtns=document.querySelectorAll('.option-btn');
  allBtns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer) b.classList.add(index===q.answer?'correct':'reveal');
  });
  if(index===q.answer){btn.classList.add('correct');score++;}
  else{btn.classList.add('wrong');}
  document.getElementById('score-label').textContent=`Score: ${score}`;
  document.getElementById('explanation').textContent='💡 '+q.explain;
  document.getElementById('explanation').className='explanation show';
  const isLast=currentIndex===currentQuestions.length-1;
  document.getElementById('next-btn').textContent=isLast?'See Results →':'Next →';
  document.getElementById('next-btn').className='next-btn show';
}

function nextQuestion(){
  currentIndex++;
  if(currentIndex>=currentQuestions.length)showResult();
  else showQuestion();
}

function showResult(){
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('result-screen').style.display='block';
  const total=currentQuestions.length;
  const pct=Math.round((score/total)*100);
  let emoji='😅',label="Keep at it — every question teaches you something.";
  if(pct>=93){emoji='🏆';label='Outstanding! You really know this stuff.';}
  else if(pct>=80){emoji='🎯';label='Solid! Review the ones you missed.';}
  else if(pct>=60){emoji='📚';label='Getting there — revisit the tricky topics.';}
  else if(pct>=40){emoji='💪';label='Keep practicing. Repetition builds mastery.';}
  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-score').textContent=pct+'%';
  document.getElementById('result-label').textContent=label;
  document.getElementById('r-total').textContent=total;
  document.getElementById('r-correct').textContent=score;
  document.getElementById('r-wrong').textContent=total-score;
  const catNames={all:'All Topics',python:'Python',oop:'OOP',ds:'Data Structures',
    algo:'Algorithms',git:'Git',math:'CS Math',db:'Databases',systems:'CS Systems',se:'Software Eng.'};
  document.getElementById('r-cat').textContent=catNames[currentCategory];
  document.getElementById('r-diff').textContent=currentDiff==='all'?'All levels':currentDiff.charAt(0).toUpperCase()+currentDiff.slice(1);
  document.getElementById('progress-fill').style.width='100%';
}

function restartQuiz(){startQuiz(currentCategory);}
function goHome(){
  document.getElementById('result-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('category-screen').style.display='block';
}

// Init counts on load
updateCounts();
</script>
